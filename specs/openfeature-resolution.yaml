# How a FeatureHub OpenFeature provider resolves a flag: a machine-readable
# specification, so providers in every language give the same results.
#
# It covers what happens once the features are in the repository, however they
# got there (see featurehub-protocol.yaml for transports): the order of
# checks, interceptors, strategy evaluation, type conversion, reasons,
# variants, error codes and flag metadata.
#
# Paths to code, tests and fixtures are in the Dart SDK repository,
# https://github.com/featurehub-io/featurehub-flutter-sdk, unless another
# repository is named.
#
# Reference implementation: featurehub-openfeatures-common
#   lib/src/openfeature/resolution.dart   (resolveFromEvaluation)
#   lib/src/repository.dart               (ClientFeatureRepository.evaluate)
#   lib/src/openfeature/context_mapper.dart (mapEvaluationContext)
# with tests in test/openfeature/mapping_and_resolution_test.dart. Agreed with
# the Go SDK (featurehub-go-sdk, pkg/core/provider.go) where noted.
#
# MUST / SHOULD / MAY as in RFC 2119.

spec:
  name: featurehub-openfeature-resolution
  version: 1.1.0
  status: implemented-in-dart (tracking is implemented in the TypeScript providers)
  changelog:
    - version: 1.1.0
      changes:
        - "tracking: OpenFeature's track(name, context, details) records a FeatureHub named usage event, from a context of its own, for the usage plugins; it never fails the caller"
    - version: 1.0.0
      changes:
        - "First published version."
  related:
    transports: featurehub-protocol.yaml (encoding of FeatureState, the context mapping, providers)
    stores: feature-store.yaml (how flags come to exist without FeatureHub, and the YAML store/interceptor pair)
    strategy_evaluation: >-
      rollout-strategies.yaml (the algorithm, the matchers, and the golden
      fixture that is its conformance suite). Percentages are out of
      1,000,000.

# ---------------------------------------------------------------------------
# Flag kinds: the OpenFeature resolution methods and the FeatureHub types
# ---------------------------------------------------------------------------
kinds:
  boolean: {feature_type: BOOLEAN}
  string: {feature_type: STRING}
  integer: {feature_type: NUMBER}
  double: {feature_type: NUMBER}
  object: {feature_type: JSON}

# ---------------------------------------------------------------------------
# Evaluation: the value before OpenFeature semantics are applied
# (ClientFeatureRepository.evaluate)
# ---------------------------------------------------------------------------
evaluation:
  inputs:
    key: the flag key
    context: >-
      For local evaluation (a client-evaluated key, or features with
      strategies): the OpenFeature context mapped to FeatureHub attributes
      (featurehub-protocol.yaml encoding.evaluation_context). An
      invalid context is an INVALID_CONTEXT error.
  steps:
    - step: interceptors
      rule: >-
        Value interceptors are consulted first, in registration order. An
        interceptor is skipped for a locked feature (l = true) unless it was
        registered with allowLockOverride (the default). The first that
        matches supplies the value; strategy id = none; intercepted = true.
    - step: not_found
      rule: >-
        If the repository has no feature for the key, the result is "not
        found" (FLAG_NOT_FOUND), even if an interceptor matched. Interceptors
        only change the values of features that exist; they never create a
        flag. A flag must first exist in the repository, from FeatureHub or
        from a feature store, which is how local-only flags are added (for
        example the YAML store paired with the YAML interceptor).
      rationale: >-
        A flag's existence and type come from the feature, not the override:
        without a feature there is no type to convert the interceptor's value
        to, and resolving unknown keys would hide misspelt flag names.
      agreed: >-
        The Go SDK, which resolves an interceptor match for an unknown key as
        STATIC, is to change to FLAG_NOT_FOUND.
    - step: no_strategies
      rule: >-
        If the feature has no strategies (absent or empty): value = the
        feature's value; strategy id = its `v` (the strategy the server
        applied, or none); split = false.
    - step: local_strategies
      rule: >-
        Otherwise apply the strategies, in order, to the context. If one
        matches: value = its value, strategy id = its id, split = true if
        it is a percentage rollout (its percentage is non-zero). Otherwise:
        value = the feature's value, strategy id = none.
  output: {feature: "the FeatureState or none", value: any, strategy_id: "string or none", split: bool, intercepted: bool}

# ---------------------------------------------------------------------------
# Resolution: OpenFeature semantics (resolveFromEvaluation), in this order
# ---------------------------------------------------------------------------
resolution:
  before_evaluation:
    - {when: "the provider has not finished initialising", value: code default, reason: ERROR, error_code: PROVIDER_NOT_READY}
    - {when: "initialisation failed (the source rejected us before any features)", value: code default, reason: ERROR, error_code: PROVIDER_FATAL}
    - {when: "the provider is stale (its source stopped for good after features)", value: "resolved normally from the last features", reason: "the usual reasons (not ERROR, not STALE)"}
    - {when: "the evaluation context is invalid", value: code default, reason: ERROR, error_code: INVALID_CONTEXT}
    - {when: "an unexpected error while evaluating", value: code default, reason: ERROR, error_code: GENERAL}
  steps:   # applied in order; the first that applies decides
    - id: not_found
      when: the feature does not exist
      result: {value: code default, reason: ERROR, error_code: FLAG_NOT_FOUND, flag_metadata: none}
    - id: wrong_feature_type
      when: the feature's type is not the kind's feature_type (e.g. a STRING feature resolved as boolean)
      result: {value: code default, reason: ERROR, error_code: TYPE_MISMATCH, flag_metadata: yes}
      note: checked before the value, so a value-less feature of the wrong type is a TYPE_MISMATCH
    - id: no_value
      when: the evaluated value is null (the feature, or the matched strategy or interceptor, has no value)
      result: {value: code default, reason: DISABLED, variant: "the strategy id, if one matched", flag_metadata: yes}
      agreed_with: go
    - id: convert
      when: always, otherwise
      rules: conversion
      on_failure: {value: code default, reason: ERROR, error_code: "TYPE_MISMATCH (or PARSE_ERROR for invalid JSON)", flag_metadata: yes}
    - id: reason
      result:
        - {when: "no strategy id (the feature's own value, or an interceptor)", reason: STATIC, variant: none}
        - {when: "a percentage rollout matched locally (split)", reason: SPLIT, variant: the strategy id, agreed_with: go}
        - {when: "any other strategy id (matched locally, or `v` from the server)", reason: TARGETING_MATCH, variant: the strategy id}
      notes:
        - "A strategy the server applied (`v`) is always TARGETING_MATCH: its percentage is not sent, so it cannot be known to be a split."
        - "The variant is always the strategy id, never its name (agreed; the Go SDK is to change)."
        - "A server-evaluated feature with no `v` is STATIC, not UNKNOWN (agreed; the Go SDK is to change)."
        - "DEFAULT is not used."

  conversion:
    description: >-
      Converting the evaluated value to the kind requested. Interceptors (and
      some sources) supply strings, so strings are converted.
    boolean:
      - "a boolean: as is"
      - "the string \"true\" or \"false\" (exact, lowercase): that boolean"
      - "anything else: TYPE_MISMATCH"
    string:
      - "a string: as is"
      - "a number or boolean: its string form"
    integer:
      - "a number, or a string parsing as a number, that is whole (3 or 3.0): that integer"
      - "a fraction (1.5), or an unparseable string: TYPE_MISMATCH"
    double:
      - "a number, or a string parsing as a number: that number as a double"
      - "anything else: TYPE_MISMATCH"
    object:
      - "a string: parsed as JSON; invalid JSON is PARSE_ERROR"
      - "an already-decoded value: as is"
      - "the result must be a JSON object (map); anything else (a list, a number, ...) is TYPE_MISMATCH"

  test_vectors:
    - {feature: null, interceptor_value: "kwong pastry", kind: string, default: "always wonder", expect: {value: "always wonder", reason: ERROR, error_code: FLAG_NOT_FOUND}, note: "an interceptor matching a key the repository does not have"}
    - {feature: {type: STRING, value: null}, kind: string, default: "always wonder", expect: {value: "always wonder", reason: DISABLED, variant: null}}
    - {feature: {type: STRING, value: null}, strategy_id: ormkorn, kind: string, default: "always wonder", expect: {value: "always wonder", reason: DISABLED, variant: ormkorn}}
    - {feature: {type: STRING, value: x}, kind: boolean, default: false, expect: {value: false, reason: ERROR, error_code: TYPE_MISMATCH}}
    - {feature: {type: BOOLEAN, value: "true"}, intercepted: true, kind: boolean, default: false, expect: {value: true, reason: STATIC}}
    - {feature: {type: NUMBER, value: "7"}, intercepted: true, kind: integer, default: 0, expect: {value: 7, reason: STATIC}}
    - {feature: {type: NUMBER, value: 1.5}, kind: integer, default: 0, expect: {value: 0, reason: ERROR, error_code: TYPE_MISMATCH}}
    - {feature: {type: JSON, value: "{not json"}, kind: object, default: {}, expect: {reason: ERROR, error_code: PARSE_ERROR}}
    - {feature: {type: STRING, value: durian}, strategy_id: omu-co, kind: string, expect: {value: durian, reason: TARGETING_MATCH, variant: omu-co}, note: "v from the server"}
    - feature:
        type: STRING
        value: plain
        strategies:
          - {id: chago, value: mango, attributes: [{conditional: NOT_EQUALS, fieldName: country, values: [thailand], type: STRING}]}
          - {id: omu-co, value: durian, percentage: 1000000, attributes: []}
      cases:
        - {context: {userkey: lingling, country: thailand}, expect: {value: durian, reason: SPLIT, variant: omu-co}}
        - {context: {userkey: orm, country: new_zealand}, expect: {value: mango, reason: TARGETING_MATCH, variant: chago}}

# ---------------------------------------------------------------------------
# Flag metadata
# ---------------------------------------------------------------------------
flag_metadata:
  description: >-
    The OpenFeature flag metadata of every resolution of an existing feature
    (including DISABLED, TYPE_MISMATCH and PARSE_ERROR results; not
    FLAG_NOT_FOUND, PROVIDER_NOT_READY or PROVIDER_FATAL).
  construction:   # in this order; later entries replace earlier ones of the same name
    - "every entry of the feature's properties (`fp`, string to string), if it has any"
    - "featureVersion: the feature's version (an integer), if it is 0 or more"
    - "featureType: the feature's type name (BOOLEAN, STRING, NUMBER or JSON)"
  precedence: featureVersion and featureType replace a property of the same name
  go_sdk_difference: >-
    The Go SDK's metadata is the properties alone, without featureVersion and
    featureType. To be aligned with this rule.
  test_vectors:
    - {feature: {version: 4, type: STRING}, expect: {featureVersion: 4, featureType: STRING}}
    - feature: {version: 4, type: STRING, fp: {shop: "omu&co", owner: kwong}}
      expect: {shop: "omu&co", owner: kwong, featureVersion: 4, featureType: STRING}
    - feature: {version: 4, type: STRING, fp: {featureVersion: "99", shop: "omu&co"}}
      expect: {shop: "omu&co", featureVersion: 4, featureType: STRING}
      note: the property named featureVersion is replaced by the feature's version

# ---------------------------------------------------------------------------
# Tracking: OpenFeature's track as FeatureHub usage
# ---------------------------------------------------------------------------
tracking:
  description: >-
    OpenFeature's tracking API (client.track) records an event that is not
    a flag evaluation: a purchase, a sign-up. A FeatureHub provider records
    it as a FeatureHub named usage event, which goes to the usage plugins
    registered with the provider's FeatureHub connection or configuration
    (an analytics tool such as Segment, say), as an application using the
    FeatureHub SDK directly records one with recordNamedUsage.
  call: "provider.track(trackingEventName, context, trackingEventDetails), as the OpenFeature SDK calls it for client.track"
  event:
    name: trackingEventName, as given
    user_key: "the context's targetingKey (as encoding.evaluation_context maps it to userkey), or else its session"
    context_attributes: "the context mapped as featurehub-protocol.yaml encoding.evaluation_context does, without the user key"
    additional_params: "every entry of trackingEventDetails (including OpenFeature's numeric `value`), as given"
    feature_values: >-
      where the SDK's named usage events carry them, the features' values
      evaluated for the tracking context, as for any named usage event of
      that SDK
  rules:
    - >-
      The event is built from a context of its own, made for the call. It
      MUST NOT change a context the provider keeps: a server-evaluated key's
      single shared context (featurehub-protocol.yaml providers.context_change)
      in particular, which would otherwise take on the tracking context's
      attributes and fetch the features again.
    - >-
      Tracking fetches nothing, and does not wait for the source: it records
      from the features held.
    - >-
      It never fails the caller: a context that cannot be mapped (an
      INVALID_CONTEXT for a resolution), or a usage plugin that fails,
      records nothing and is not raised. Before initialisation, and after
      shutdown, it records nothing.
    - >-
      With no usage plugin registered the event goes nowhere. Tracking is
      not sent to FeatureHub.
    - >-
      Hooks are not involved: OpenFeature runs hooks around flag
      evaluations only, so an OpenTelemetry hook does not see tracked
      events; usage plugins do.
  test_vectors:
    - call: {name: "checkout-complete", context: {targetingKey: lingling, plan: "always wonder"}, details: {value: 99.95, currency: NZD}}
      expect: {eventName: "checkout-complete", userKey: lingling, contextAttributes: {plan: "always wonder"}, additionalParams: {value: 99.95, currency: NZD}}
    - call: {name: "todo-add", context: {session: s1, country: NZ}, details: {}}
      expect: {eventName: "todo-add", userKey: s1, contextAttributes: {session: s1, country: NZ}}
      note: "no targetingKey: the session is the user key; the well-known key is written lowercase"
    - call: {name: "kwong-pastry", context: {targetingKey: orm, shop: {nested: true}}, details: {}}
      expect: "nothing recorded, and no error raised"
    - call: {name: "omu-co", context: {targetingKey: kornaphat}, details: {}, provider: "server-evaluated key, shared context last used for {targetingKey: chago}"}
      expect: "the event's user key is kornaphat; the shared context still has user key chago, and no features are fetched"
  conformance:
    - {id: track-named-usage, check: "tracking.test_vectors all reproduce, as seen by a usage plugin"}
    - {id: track-own-context, check: "tracking with a server-evaluated key leaves the shared context, and the features held, unchanged, and makes no request"}
    - {id: track-never-fails, check: "tracking with an unmappable context, a failing usage plugin, before initialisation or after shutdown raises nothing"}

