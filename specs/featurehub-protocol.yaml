# The FeatureHub protocol, as the SDKs use it: a machine-readable
# specification.
#
# Describes, precisely enough to reimplement in another language:
#   1. the encoding (FeatureState, rollout strategies, the SHA, the
#      evaluation context);
#   2. polling and passive scheduling (shared with the snapshot client);
#   3. what the repository does with each notification;
#   4. the transport contract (how any source fills a feature repository);
#   5. how providers choose and wire a transport;
#   6. how the built-in transports talk to FeatureHub Edge (polling and
#      streaming).
#
# Your own server re-serving these features to its own clients, and those
# clients, are a separate protocol: feature-snapshot-protocol.yaml, which builds on
# sections 1 to 5 of this one.
#
# Paths to code, tests and fixtures are in the Dart SDK repository,
# https://github.com/featurehub-io/featurehub-flutter-sdk, unless another
# repository is named.
#
# Reference implementation: the Dart SDK,
#   featurehub-openfeatures-common (lib/src/repository.dart,
#   lib/src/transport/ (the transport contract, and the FeatureHub SSE and
#   FeatureHub polling transports), lib/src/openfeature/featurehub_connection.dart,
#   lib/src/openfeature/context_mapper.dart).
#
# Conventions: MUST / SHOULD / MAY as in RFC 2119. "repository" is the local
# in-memory store of features that resolutions read from. Everything marked
# `reference_behaviour` is what the Dart SDK does; implementations SHOULD match
# it so clients and servers in different languages interoperate.

spec:
  name: featurehub-protocol
  version: 1.2.0
  sdk_version: 2
  status: implemented-in-dart
  changelog:
    - version: 1.2.0
      changes:
        - "featurehub_edge.feature_updates: every SDK, client- and server-side, MUST provide a feature updater: PUT <host>/features/<apiKey>/<featureKey> with a FeatureStateUpdate (value, updateValue, lock), changing a feature's value or lock in an environment through Edge, as tests and test tools do. Its result is the outcome Edge answered (applied, unchanged, invalid, forbidden, not found, not possible, unavailable) and never an exception for an HTTP status"
        - "todo-server-tests.yaml: the end-to-end suite (a todo server, an SDK's feature updater and its client) that every SDK can run, taken out of the JavaScript SDK's cucumber tests"
    - version: 1.1.2
      changes:
        - "featurehub_edge.sdk_version.generations: a request without sdk_version is generation 1. Edge honours Last-Event-ID, and holds quiet connections, only for sdk_version 2 or more; generation 1 always gets the full features on every connection. An SDK sends 2 only if it implements streaming.last_event_id in full, short_connections included"
        - "featurehub_edge.query_parameters: the SDK's query parameters come in a fixed order, contextSha, sdk_version, then xfeaturehub (after the apiKey parameters when polling), so equal requests have equal URLs for a CDN. Streaming now sends contextSha too"
        - "featurehub_edge.streaming.last_event_id.short_connections: a connection that ends less than 10 seconds after its request was sent, with a bye or without, is a failure (a cache in front of Edge replaying a closed stream), and nothing it delivers resets the failure count; consecutive ones SHOULD be logged as a likely cache misconfiguration. In browsers, without a maximum number of attempts, short connections keep backing off up to the maximum delay"
        - "providers.environment_variables.durations: every duration variable uses one strict grammar (a single number and a lowercase unit, ms, s, m or h, or 0), not Go's time.ParseDuration; compound values such as 1m30s are not accepted"
        - "providers.environment_variables.legacy_names: only new SDKs (Dart and Go) implement this specification, and they read none of the legacy names"
        - "featurehub_edge.streaming.last_event_id.quiet_connections: an SDK SHOULD warn about a read timeout of 5 minutes or less (it was: less than 5 minutes)"
        - "repository.environment_stale: the SDK SHOULD log a warning, once, when the environment becomes stale (236 or edge.stale)"
        - "providers.default_mode replaces featurehub_edge.streaming.server_evaluated.no_default_mode: a server-evaluated key defaults to streaming in an SDK that supports server-evaluated streaming (it is a validation error without a mode only in one that does not). Client-side SDKs choose their own default and document it: Dart's client provider polls passively"
        - "providers.context_change.single_context: a provider that sends the context (a server-evaluated key, or sendContext) has exactly one active context, in every SDK. A context change blocks every resolution until the new context's features arrive, and no resolution is answered from the previous context's features as the new one's: asynchronous resolutions wait (up to waitForReady, then PROVIDER_NOT_READY, and the next waits again); synchronous ones return the previous context's values with the reason STALE until waitForReady has passed, then PROVIDER_NOT_READY. Once the source has stopped for good, the last features serve only the context they belong to; any other gets PROVIDER_NOT_READY (it previously got the last features)"
    - version: 1.1.1
      changes:
        - "featurehub_edge.streaming.last_event_id: SSE clients keep the last event id and send it as Last-Event-ID on reconnection (not for a new context). Edge then sends no features if nothing is new: it holds the connection (typically 60 seconds, up to 3 to 5 minutes), possibly silent, then sends bye and closes, so several reconnections may bring no updates. A bye ends a connection cleanly and resets the failure count (attempt_reset); read timeouts SHOULD exceed 5 minutes"
        - "providers.environment_variables: FEATUREHUB_CONNECT_TYPE (active, passive or streaming) and FEATUREHUB_CONNECT_INTERVAL replace FEATUREHUB_POLLING_INTERVAL and FEATUREHUB_POLLING_PASSIVE, and give the default mode and interval (mode_selection). Active and passive both need an interval, in code or from FEATUREHUB_CONNECT_INTERVAL (passive no longer defaults to 0); streaming does not use it"
        - "providers.environment_variables.durations.connect_interval: FEATUREHUB_CONNECT_INTERVAL is a single number followed by a time unit (ms, s, m, h), and is 0 (connect once and stop) or at least 5 seconds"
        - "providers.environment_variables.applies_to: environment variables apply only to server-side SDKs (Go, Python, Ruby, Dart's featurehub-openfeatures-server); client-side SDKs do not read them"
        - "providers.environment_variables.legacy_names: existing SDKs keep their legacy variables as they read them today, used only when neither new variable is set; the JavaScript millisecond exception now applies only to its legacy FEATUREHUB_POLLING_INTERVAL"
        - "featurehub_edge.sdk_version replaces featurehub_edge.sdk_identification: the sdk and version query parameters are dropped, and polling (activePolling and passivePolling) and streaming MUST send sdk_version=2 (spec.sdk_version, the protocol generation this specification defines; it changes only when the wire protocol to Edge changes, not with minor or patch releases of this specification). Every SDK that adheres to this specification sends the same URL, so a CDN in front of Edge is not fragmented by SDK, language or release"
    - version: 1.1.0
      changes:
        - "featurehub_edge.sdk_identification: polling (activePolling and passivePolling) and streaming MUST send sdk (the SDK's name/language) and version (the SDK's version) query parameters on every request to Edge"
        - "providers.environment_variables: the environment variable names, the duration format and how the mode is chosen from them"
        - "polling_transport.interval.absent: refers to providers.environment_variables instead of the Go SDK"
    - version: 1.0.0
      changes:
        - "First published version."
  related:
    featurehub_edge_sse_events: FeatureHub Edge's own SSE stream (event names reused, see transport.relaying_featurehub_events)
    strategy_evaluation: >-
      rollout-strategies.yaml (murmur3 percentage rollouts and the STRING,
      NUMBER, DATE, DATETIME, SEMANTIC_VERSION, IP_ADDRESS and BOOLEAN
      matchers, with the golden fixture as the conformance suite).
    openfeature_resolution: openfeature-resolution.yaml (what a provider does with a feature once it is in the repository)
    feature_stores: feature-store.yaml (stores, raw feature updates, the shared storage formats)
    feature_snapshots: feature-snapshot-protocol.yaml (your own server re-serving features, and its clients)

# ---------------------------------------------------------------------------
# 1. Encoding
# ---------------------------------------------------------------------------
encoding:
  media_type: application/json
  charset: utf-8

  feature_state:
    description: >-
      One feature, as FeatureHub Edge delivers it. The same JSON object is used
      on FeatureHub's own API, in snapshots, and in transport notifications.
    json_schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: featurehub/feature-state
      type: object
      required: [id, key, version, type]
      properties:
        id: {type: string, description: "Feature value id. Unique per feature; used for sorting in the SHA."}
        key: {type: string, description: "Feature key, as used by code."}
        l: {type: boolean, default: false, description: "Locked in its environment."}
        version: {type: integer, description: "Increases whenever the feature changes in FeatureHub. Decoders MUST accept a JSON number and truncate to integer."}
        type: {enum: [BOOLEAN, STRING, NUMBER, JSON]}
        value:
          description: >-
            Absent or null = no value (resolves to the code default). BOOLEAN:
            boolean. STRING: string. NUMBER: number. JSON: a string holding JSON
            text (not a nested object).
        v: {type: [string, "null"], description: "Id of the rollout strategy that supplied `value` (server-evaluated or snapshot-evaluated features); null/absent if the default value applies."}
        fp: {type: object, additionalProperties: {type: string}, description: "Feature properties (string to string). Optional."}
        environmentId: {type: string, description: "Optional. Never sent by FeatureHub Edge, as the environment wrapping the features carries its id (featurehub_edge.polling.edge_api); an SDK MAY fill it in from that wrapper."}
        strategies:
          type: [array, "null"]
          description: "Rollout strategies, in evaluation order. Present only when the receiver is to evaluate locally (client-evaluated keys, or a raw snapshot); absent, null and empty all mean none."
          items: {$ref: "featurehub/rollout-strategy"}
      additionalProperties: true
    required_fields: >-
      id, key, version and type are required. The Edge OpenAPI definition
      (featurehub_edge.polling.edge_api) marks only id and key as required,
      but FeatureHub Edge always sends version and type, and this protocol
      relies on them (the update rule compares versions; a value is resolved
      by its type). A decoder MUST skip a feature without a version or a
      type, as an invalid feature: it is not applied, and in a full set its
      key counts as not in the set.
    encoding_rules:
      - Encoders SHOULD omit `value`, `v`, `fp`, `environmentId` and `strategies` when null (the Dart encoder does).
      - Encoders MUST always write `id`, `key`, `l`, `version`, `type`.
      - Decoders MUST ignore unknown properties.

  rollout_strategy:
    json_schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: featurehub/rollout-strategy
      type: object
      required: [id]
      properties:
        id: {type: string}
        value: {description: "The value given when this strategy matches (same typing rules as feature_state.value)."}
        percentage: {type: [integer, "null"], description: "Optional percentage rollout, out of 1,000,000; absent or null means none."}
        percentageAttributes: {type: [array, "null"], items: {type: string}, description: "Nullable; absent or null has the same meaning as an empty list."}
        attributes:
          type: [array, "null"]
          description: "Nullable; absent or null has the same meaning as an empty list (e.g. a pure percentage strategy)."
          items:
            type: object
            required: [conditional, fieldName, type]
            properties:
              id: {type: string}
              conditional: {enum: [EQUALS, ENDS_WITH, STARTS_WITH, GREATER, GREATER_EQUALS, LESS, LESS_EQUALS, NOT_EQUALS, INCLUDES, EXCLUDES, REGEX]}
              fieldName: {type: string}
              values: {type: [array, "null"], description: "Nullable; absent or null has the same meaning as an empty list."}
              type: {enum: [STRING, SEMANTIC_VERSION, NUMBER, DATE, DATETIME, BOOLEAN, IP_ADDRESS]}

    decoding_rules:
      - "attributes, percentageAttributes, an attribute's values and percentage are nullable, and may be absent: decoders MUST accept null and absence (other SDKs keep them as null; the Dart one decodes the lists as empty lists)"
      - "the meaning is the same either way: evaluation (rollout-strategies.yaml) treats a null or absent list exactly like an empty one, and a null percentage as none"
    dart_status: >-
      The Dart decoder (featurehub_client_api FeatureRolloutStrategy) decodes a
      null or absent attributes, percentageAttributes or values as an empty
      list. (It used to throw for a null attributes, failing the whole
      feature; fixed by a hand edit to the generated code, which must be kept
      if the client is regenerated.)
    other_languages: >-
      Every other language (Go, TypeScript, Java, ...) decodes a null or absent
      attributes, percentageAttributes or values as null, and evaluates it as
      an empty list; their encoders may write null for an empty list.

  sha:
    description: >-
      Identifies a set of features by their ids and versions only (not values).
      Every FeatureHub SDK computes it the same way (the Redis store keys and the
      snapshot ETag use it).
    algorithm:
      - take the features (the repository's current features; keys that code has only asked for, with no feature, are excluded)
      - sort by `id`, ascending, by plain string comparison (UTF-16 code unit order; equal to code point order for BMP ids)
      - map each to "<id>:<version>" (version as a base-10 integer)
      - join with "|"
      - SHA-256 of the UTF-8 bytes, as 64 lowercase hex characters
    when_recomputed: >-
      The repository recomputes it after every applied change: a full set of
      features, a single feature update, a delete, and clearing the features.
      In SDKs that support catch-and-release (only some do, typically those
      for user interfaces; see feature-store.yaml catch_and_release), also
      after a release, and while updates are held back it describes the
      applied features, not those held back.
    test_vectors:
      - features: []
        input: ""
        sha: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      - features: [{id: only, version: 0}]
        input: "only:0"
        sha: 03a55f20ac287349c236160cf813e321e0084e7c2cdef7cabf43374a85a971a8
      - features:
          - {id: f3c1a2b4-1d2e-4c5b-9a8b-7c6d5e4f3a2b, version: 3}
          - {id: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d, version: 12}
          - {id: a0000000-0000-4000-8000-000000000000, version: 1}
        input: "0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d:12|a0000000-0000-4000-8000-000000000000:1|f3c1a2b4-1d2e-4c5b-9a8b-7c6d5e4f3a2b:3"
        sha: ffef4b48076b58be67b0abe8baa76b13915242208613701a2d3a8328e3eb4ef1
      - features: [{id: f1, version: 2}, {id: f2, version: 1}]
        input: "f1:2|f2:1"
        sha: 90efe21f27585227b23a9782d8aabd8b5139cda839df1a0b8b60fe4c6673c9fd

  evaluation_context:
    description: >-
      How an OpenFeature evaluation context (a map, targeting key under
      `targetingKey`) becomes FeatureHub attributes (Dart: mapEvaluationContext,
      MappedContext).
    rules:
      - entries with a null value are skipped
      - "`targetingKey` or `userkey` (case-insensitive) becomes `userkey`; its value is stringified (see wire_value)"
      - >-
        the well-known keys are exactly the StrategyAttributeWellKnownNames
        schema of the FeatureHub Edge OpenAPI definition
        (currently http://api.dev.featurehub.io/edge/1.1.9.yaml, from which
        featurehub_client_api is generated; currently device, country, platform, userkey,
        session, version). They are recognised case-insensitively and
        written lowercase; userkey is handled by the rule above. Nothing else
        (email, for example) is well-known: implementations SHOULD take the
        list from the generated model rather than keep their own copy.
      - any other key passes through unchanged (case preserved)
      - "allowed values: string, number, boolean, date-time, or a list of those"
      - "any other value (an object, or a list containing one) is an invalid context: server -> 400; client provider -> INVALID_CONTEXT error"
      - "attribute order: userkey first, then the others"
    wire_value:
      description: How each attribute value becomes a string when sent (query parameter or x-featurehub header).
      rules:
        - "date-time: UTC ISO-8601 (e.g. 2026-11-17T02:47:28.000Z)"
        - "number: JavaScript String(n) - whole floats without a fraction (3.0 -> \"3\"), NaN -> \"NaN\", Infinity -> \"Infinity\""
        - "boolean: \"true\" / \"false\""
        - "string: as is"
        - "list: one string per element (each element by the rules above)"
    x_featurehub_header:
      description: >-
        FeatureHub's server-evaluated context header (also the `xfeaturehub`
        query parameter for browser SSE, where an SDK streams server-evaluated
        keys: featurehub_edge.streaming.server_evaluated). Not used by the
        snapshot client, but exposed to custom transports as
        FeatureHubTransportTarget.contextHeader.
      format: >-
        for each attribute: query-component-encode(key) + "=" +
        query-component-encode(values joined by ","); sort these encoded
        strings (plain string comparison); join with ","; no attributes -> no
        header. An attribute whose values are all null, or that has no
        values, is left out.
      query_component_encode: >-
        Everything is encoded, keys as well as values, as JavaScript's
        encodeURIComponent does: UTF-8, then every byte except A-Z a-z 0-9
        - _ . ! ~ * ' ( ) as %XX (uppercase hex). So a "," or "=" in a key or
        a value can never be confused with the separators.
      example: "country=nz,userkey=fred"
      examples:
        - {attributes: {userkey: [fred], country: [nz]}, header: "country=nz,userkey=fred"}
        - {attributes: {shop: ["a&b", "c d"]}, header: "shop=a%26b%2Cc%20d"}
        - {attributes: {"my key": [x], "a,b=c": [y]}, header: "a%2Cb%3Dc=y,my%20key=x"}

# ---------------------------------------------------------------------------
# 2. Polling / passive scheduling (shared by FeatureHub polling and snapshots)
# ---------------------------------------------------------------------------
polling_transport:
  serialisation: one request at a time; a forced request waits for the one in flight
  interval:
    zero_polls_once: >-
      DELIBERATE, not a mistake: a poll interval of 0 means "poll once and
      stop". The transport makes its first request (start) and then never
      polls again, in both modes: activePolling schedules nothing, and
      passivePolling's refreshIfStale does nothing (it MUST NOT treat a
      0-second-old snapshot as stale, which would make a request on every
      resolution). A failed first request is not retried. A FeatureHub
      Cache-Control max-age does not start polling again. contextChanged
      still makes its forced request (it is not periodic). Use it for
      short-lived processes, or features that are only read at start-up.
      The transport is not stopped or failed: the provider stays Ready with
      the features it got.
    minimum: >-
      Any interval other than 0 MUST be at least 5 seconds, so that no
      configuration polls a server too often: a shorter one is a validation
      error (providers.validation_errors), never silently raised. It applies
      to FeatureHub polling and the snapshot client, in both modes. A
      FeatureHub Cache-Control max-age below it is raised to it (the server
      is not configuration, so it is not an error). An SDK MAY lower the
      minimum for its own tests, but MUST NOT let applications lower it (Go:
      core.MinPollingInterval, read from an internal package that only the
      SDK's tests can change; Dart: minPollingInterval in
      featurehub_openfeatures_common's lib/src/transport/polling_limits.dart,
      which is not exported, so only a direct import of the src file, which
      the analyzer warns about, can change it).
    negative: a negative interval is a validation error (providers.validation_errors)
    absent: >-
      Where an interval is required (the server provider polling, and
      activePolling or passivePolling chosen through FEATUREHUB_CONNECT_TYPE:
      providers.environment_variables.mode_selection), it MUST be given
      explicitly, in code or by FEATUREHUB_CONNECT_INTERVAL; 0 (poll once)
      is an explicit interval. Where an SDK's legacy variables default a
      missing interval to 0 (providers.environment_variables.legacy_names),
      that is poll once, as above.
  start:
    - "if the repository is already ready (e.g. loaded from a store): request in the background; else await the first request"
    - "then, with activePolling, schedule the next poll (none with an interval of 0: interval.zero_polls_once)"
  active_polling:
    schedule: >-
      After each poll finishes, whether it succeeded or failed, wait the full
      poll interval (or a FeatureHub Cache-Control max-age that replaced it;
      see featurehub_edge.polling.cache_control) from when it finished, then
      make a forced request, then schedule again. The wait is measured from
      the end of the poll, not its start, so a slow or failing server is
      never polled faster than the interval and a failure never becomes a
      tight retry loop. Stop when closed or dead. A fixed periodic timer MUST
      NOT be used with an unforced freshness check: the tick lands
      microseconds inside the window and every other poll is skipped.
  passive_polling:
    refresh_if_stale: >-
      Called as flags are resolved (the server provider awaits it before each
      resolution; the app provider fires it without waiting, resolution being
      synchronous). Makes an unforced request.
    failure_backoff: after a failed request, no unforced request until now + interval
    zero_interval: "refreshIfStale does nothing after the first request (interval.zero_polls_once)"
  context_changed: >-
    a forced request (fetches for the new context immediately). On a
    transport that has been closed it makes that one request, so the new
    context's features arrive, and stays closed: it does not start polling
    again. Once the environment is stale (236) or the connection has
    failed (repository.connection_failed) it makes no request at all
    (providers.context_change).
  errors: logged; the next poll or refresh retries

# ---------------------------------------------------------------------------
# 3. The repository side (what notify must do)
# ---------------------------------------------------------------------------
repository:
  readiness:
    initial: NotReady
    values: [NotReady, Ready, Stale, Failed]
    meanings:
      NotReady: no features are held
      Ready: features are held and are current (for the current context, from a live source)
      Stale: "features are held and keep being resolved, but may not be current"
      Failed: "final: the connection failed before any features were received"
    transitions:
      - "NotReady -> Ready: a full set of features"
      - "NotReady -> Failed: notify(failure) before any full set has ever been received"
      - "Ready -> Stale: a context change is in progress (providers.context_change), markEnvironmentStale(), or notify(failure) after features"
      - "Stale -> Ready: a full set of features, unless the connection has failed or the environment is stale (then it stays Stale)"
      - "Stale -> NotReady: the features are cleared"
    rules:
      - >-
        Ready never goes straight to NotReady. Clearing the features while
        Ready goes Ready -> Stale -> NotReady (both are broadcast, in that
        order), and a context change goes Ready -> Stale, not NotReady.
      - >-
        Failed is final, and is only reached from NotReady: once a full set
        has been received, nothing makes readiness Failed (a permanent
        failure then is connection_failed, and readiness is Stale).
      - >-
        Once the connection has failed or the environment is stale, nothing
        will bring the features up to date: a later full set (for example
        from a store) is still applied, but readiness stays Stale.
      - >-
        Readiness is not the connection's state: Stale does not by itself
        mean the source has stopped (a context change is also Stale). A
        permanent stop is told apart by connection_failed and
        environment_stale, which providers use for STALE.
  notifications:
    features:
      payload: list of feature_state (objects or JSON)
      invalid_payload: >-
        A payload that is not a list (a string, an object, a number) is not a
        full set: it MUST be ignored (logged), changing nothing - no feature
        is applied or removed and readiness does not change. Otherwise
        removing every feature not in the "set" would empty the repository
        and still make it Ready. Individual entries that are not valid
        features (no key, no version) are skipped, and their keys count as
        not in the set.
      semantics:
        - apply each feature with the update rule below
        - remove every held feature whose key is not in the set (keys only asked for by code, with no feature, are kept)
        - readiness becomes Ready (from NotReady or Stale) and is broadcast (every time, so waiters for "the next ready" wake up), unless the connection has failed or the environment is stale, when it stays Stale
        - recompute the SHA
    feature:
      payload: one feature_state
      semantics: apply with the update rule; recompute the SHA if applied
    deleteFeature:
      payload: one feature_state (only key/id needed)
      semantics: remove it (and, where catch-and-release is supported, any update for it held back); recompute the SHA
    bye:
      semantics: "readiness MUST NOT change, and nothing is broadcast: the connection is being re-established, and the features held are still the latest known (Ready stays Ready, Stale stays Stale; before any features it stays NotReady). Providers report nothing and do NOT report stale; the features arrive again on reconnection, as a full set"
    failure:
      semantics: "The connection updating the repository has permanently failed: raise connection_failed. Before any features: readiness Failed (final), and the provider's initialisation fails (PROVIDER_FATAL). After features: readiness Ready -> Stale (or stays Stale), the provider reports STALE for good and keeps resolving from the last features"
      before_any_features: >-
        "Before any features" means no full set of features has ever been
        received, not "readiness is not Ready". During a context change
        readiness is Stale and the old features are still held: a failure
        then (for example a 4xx in reply to the context change's request)
        raises connection_failed, readiness stays Stale (never Failed), and
        the old features keep being resolved.
  connection_failed:
    call: notify(failure)
    semantics: >-
      A repository event, separate from readiness: the connection being used
      to update the repository has permanently failed and will send nothing
      more (transport.permanent_failure). The repository sets
      connectionFailed = true, once, and broadcasts it to its listeners as
      its own event (not as a readiness change; readiness changes as in
      notifications.failure, and is broadcast separately). Later
      notify(failure) calls change nothing. Providers use it, with
      environment_stale, to report STALE: a Stale readiness alone (a context
      change in progress) is not a reason to.
  environment_stale:
    call: markEnvironmentStale() (not a notify state)
    semantics: >-
      The source says the environment is stale and will send no further
      updates (FeatureHub Edge's 236 when polling, or edge.stale when
      streaming),
      after the last features. Sets environmentStale = true, once, and
      broadcasts it to its listeners as its own event (as connection_failed
      is). Readiness goes from Ready to Stale, or stays Stale (if no features
      have ever been received, readiness is unchanged); initialisation has
      already finished, and resolutions continue from the last features. Providers report STALE,
      permanently. The SDK SHOULD log a warning (not an error: Edge is
      working as intended, and resolutions continue), once, when the
      environment becomes stale, saying that it is stale and its features
      will not be updated again. It is a separate signal from bye because a bye means the
      source will send more (it is reconnecting), and a stale environment
      means it never will.
  update_rule: >-
    Reject an incoming feature if the held one has a higher version, or the
    same version and the same value, v, id and type. Otherwise replace it.
    (Same-version replacement is needed because a server-evaluated feature
    changes value/v without a version change when the context changes, and
    a stored/local feature may differ in id or type.)

# ---------------------------------------------------------------------------
# 4. Transport contract (pluggable sources: WebSockets, other SSE clients, ...)
# ---------------------------------------------------------------------------
transport:
  description: >-
    A transport moves features from any source into the repository. The
    built-in ones are FeatureHub streaming (SSE), FeatureHub polling, and the
    snapshot client (feature-snapshot-protocol.yaml client). A user-supplied factory
    replaces them.
  factory: "transportFactory(target: FeatureHubTransportTarget) -> FeatureHubTransport"
  target_fields:
    repository: the repository to notify
    host: FeatureHub Edge URL, if configured
    apiKey: FeatureHub API key, if configured
    featuresUrl: your own server's URL, if configured
    mode: "streaming | activePolling | passivePolling"
    pollInterval: duration
    headers: map to send with every request
    reconnectPolicy: reconnection delays (FeatureHub SSE semantics)
    connectTimeout: duration or none
    requestTimeout: duration or none
    dio: the configured HTTP client for requests, if supplied
    httpClient: the configured HTTP client for streaming, if supplied
    sendsContext: true if the source must be told the context (it returns features evaluated for it)
    contextAttributes: "derived: map name -> list of strings of the current context; empty if not sendsContext"
    contextHeader: "derived: encoding.evaluation_context.x_featurehub_header of the current context; null if not sendsContext or no attributes"
  methods:
    start:
      must: begin fetching; give the first full set via notify(features)
      returns: may complete before features arrive; initialisation waits (up to waitForReady) for readiness
    contextChanged:
      called: only when sendsContext, after the repository's context has been replaced
      must: fetch for the new context and notify a full set; the caller waits (up to its timeout) for the next readiness notification
    refreshIfStale:
      called: passivePolling, on resolution
      must: fetch if older than pollInterval; otherwise do nothing (a no-op is fine for push transports)
    close:
      must: stop and release connections
  permanent_failure:
    rule: >-
      The same for every transport, built-in or custom. A permanent failure
      is never retried: the transport notifies failure and stops. Before the
      first features the provider's initialisation fails (ERROR,
      PROVIDER_FATAL); after them the provider reports STALE, for good, and
      keeps resolving from the last features.
    what_is_permanent:
      - "FeatureHub Edge, polling or streaming: any 4xx, 429 included"
      - "your own server (snapshot client): any 4xx except 429 (feature-snapshot-protocol.yaml client.responses)"
      - "a streaming connection that stops for good for any other reason: a status the reconnect policy does not retry, or running out of its attempts (nothing reconnects after it, so it is not a bye)"
      - "a browser EventSource closing (readyState CLOSED), which hides the status"
    not_permanent: >-
      Everything else is temporary and retried: a 5xx, a network error or
      timeout, and (when streaming) an invalid 1xx or 3xx response. A stale
      environment (236, edge.stale) is not a failure either: the provider
      reports STALE and readiness goes from Ready to Stale (repository.environment_stale).
  helpers:
    requirement: >-
      OPTIONAL. An SDK that implements feature-snapshot-protocol.yaml MUST
      provide both; an SDK that does not MAY omit them.
    loadFeatureSnapshot: >-
      repository.loadFeatureSnapshot(data): loads a feature_snapshot, its JSON
      (a map or a string) or a bare array of features as a full set (the same
      as notify(features)), decoding as feature-snapshot-protocol.yaml
      encoding.feature_snapshot.decoding,
      and returns the snapshot. A format error leaves the repository
      unchanged. The snapshot client uses it; a custom transport receiving
      snapshots can too.
    featuresSha: >-
      repository.featuresSha: encoding.sha of the features held, recomputed
      on every applied change. A transport can send it as an ETag, or compare
      it with a snapshot's sha to see whether anything changed.
  notifications:   # the only calls a transport needs to make
    - {call: "notify(features, list)", when: "a full set; the first makes the provider ready"}
    - {call: "notify(feature, one)", when: one feature added or updated}
    - {call: "notify(deleteFeature, one)", when: one feature deleted}
    - {call: "notify(bye, null)", when: "connection lost, being re-established (the provider stays ready; it is not reported as stale)"}
    - {call: "notify(failure, null)", when: "the connection has permanently failed (e.g. an invalid key); stop trying. The repository raises connection_failed. Before any features the provider fails to initialise (PROVIDER_FATAL); after them it reports STALE for good and keeps resolving from the last features"}
    - {call: "markEnvironmentStale()", when: "after the last features, FeatureHub says the environment is stale (polling 236, streaming edge.stale): provider reports STALE for good and keeps resolving; stop"}
  relaying_featurehub_events:
    description: >-
      FeatureHub Edge's SSE stream uses these event names with JSON `data:`;
      a transport carrying them verbatim maps name -> notification and passes
      the decoded data.
    event_names:
      ack: ignore
      bye: bye
      failure: failure
      features: features
      feature: feature
      delete_feature: deleteFeature
      config: 'not a repository event: data with an edge.stale key, whatever its value (true, false, null, anything), means the environment will never change again: markEnvironmentStale(), then stop (no reconnect, no bye). A config without an edge.stale key, or whose data is not a JSON object, is ignored'
      error: ignore
  example_websocket_protocol:
    description: >-
      The protocol used by the reference test
      (featurehub-openfeatures-common/test/openfeature/custom_transport_test.dart);
      any protocol works, this is an illustration.
    connect: "WebSocket to featuresUrl, sending target.headers"
    server_to_client: '{"event": "<event name>", "data": <JSON payload>}'
    client_to_server_on_start_and_context_change: '{"context": {"userkey": ["fred"], ...}}'
    on_socket_closed: notify(bye)

# ---------------------------------------------------------------------------
# 5. Provider wiring
# ---------------------------------------------------------------------------
providers:
  source_selection:
    - {given: "host + apiKey", transport: "FeatureHub: FeatureHubSseTransport for streaming, FeatureHubPollingTransport for activePolling or passivePolling. Without a mode, the default_mode applies; for a server-evaluated key streaming is only available in an SDK that supports it (featurehub_edge.streaming.server_evaluated)"}
    - {given: "featuresUrl, and no apiKey", transport: "your own server: FeatureSnapshotTransport, activePolling (the default, for the providers and FeatureHubConnection alike) or passivePolling; streaming is an error unless a transportFactory is given (feature-snapshot-protocol.yaml)"}
    - {given: "transportFactory", transport: "the custom transport (it may use any of host, apiKey, featuresUrl)"}
    - {given: "only stores", transport: "none; features come from stores"}
  default_mode:
    description: >-
      The mode a provider (or connection) uses when the application gives
      none, in code or, in a server-side SDK, through
      FEATUREHUB_CONNECT_TYPE and FEATUREHUB_CONNECT_INTERVAL
      (environment_variables.mode_selection, which comes first).
    server_side: >-
      Streaming, for a client-evaluated key, and for a server-evaluated key
      in an SDK that supports server-evaluated streaming
      (featurehub_edge.streaming.server_evaluated). In one that does not, a
      server-evaluated key has no default: the mode MUST be chosen, and
      without one it is a validation error (validation_errors). On a server,
      client-evaluated keys are the norm (a server-evaluated key gives the
      provider a single context: context_change.single_context), but they
      are not required.
    client_side: >-
      A client-side SDK (mobile, desktop or browser applications, which
      usually use server-evaluated keys) chooses its own default, for any
      key, and MUST document it; it MAY have a default pollInterval, as it
      reads no environment variables. Dart's client provider
      (featurehub-openfeatures-client) uses passivePolling, every 30 seconds
      unless pollInterval is given: an application reads its flags when it
      needs them, so a refresh then is enough, and it holds no connection
      open.
    featuresUrl: "your own server is only polled: activePolling, for the providers and FeatureHubConnection alike, unless a client-side SDK documents another polling default (Dart's client provider: passivePolling)"
  validation_errors:
    - only one of host/apiKey given (empty strings count as not given)
    - featuresUrl together with host or apiKey
    - featuresUrl with streaming and no transportFactory
    - "a server-evaluated key (no '*') with streaming, and no transportFactory, in an SDK that does not support server-evaluated streaming (featurehub_edge.streaming.server_evaluated)"
    - "a server-evaluated key (no '*') with no mode, and no transportFactory, in an SDK that does not support server-evaluated streaming: the mode must be given, explicitly or through the SDK's environment variables where it reads them (default_mode)"
    - "nothing to get features from (no host+apiKey, featuresUrl, transportFactory or stores)"
    - "server provider: activePolling or passivePolling without a pollInterval (0 is a valid interval: poll once, polling_transport.interval.zero_polls_once)"
    - "a negative pollInterval, or one between 0 and 5 seconds (activePolling or passivePolling, FeatureHub or your own server; polling_transport.interval.minimum)"
  environment_variables:
    description: >-
      The environment variables an SDK reads its configuration from, so that
      the same deployment settings work whichever SDK an application uses.
    applies_to: >-
      Server-side SDKs only (for example Go, Python, Ruby, and Dart's
      featurehub-openfeatures-server): every one MUST support the names in
      `names` with the meanings given there. Client-side SDKs (browsers,
      mobile and desktop apps, Dart's client provider) do not have access
      to environment variables, do not read them, and are configured in
      code only.
    precedence: >-
      Configuration given in code always wins, setting by setting: an
      environment variable only supplies what the application has not set
      itself. A mode given in code means FEATUREHUB_CONNECT_TYPE is not
      consulted, but FEATUREHUB_CONNECT_INTERVAL still supplies the interval
      if the code gives none (mode_selection.interval); an interval given in
      code means FEATUREHUB_CONNECT_INTERVAL is not consulted; a
      transportFactory means neither is.
    set: >-
      A variable counts as set when it is present and not empty (after
      trimming whitespace); an empty one is the same as an absent one.
    durations:
      format: >-
        Every duration variable (intervals, delays, timeouts) is a single
        decimal number, with an optional fraction, followed by a lowercase
        time unit - ms, s, m or h - such as 30s, 500ms, 5m or 1.5h. There
        are no spaces, no signs, no compound values (1m30s is not accepted)
        and no other units. The unit is REQUIRED: "30" is not a duration (it
        would mean seconds to one SDK and milliseconds to another). The
        single exception is "0", which needs no unit. The value is trimmed
        (as for `set`) before it is matched. This is deliberately not Go's
        time.ParseDuration, nor any language's own parser: every SDK matches
        the same regular expression, so a value is accepted by all of them or
        by none.
      grammar: '^(0|[0-9]+(\.[0-9]+)?(ms|s|m|h))$'
      valid: ["0", "0s", "5s", "30s", "5000ms", "1.5m", "1h", "500ms"]
      invalid: ["30", "1.5", "1m30s", "-30s", "+30s", "30 s", "30S", "1us", ".5s", "ten"]
      multiplier: >-
        FEATUREHUB_SSE_BACKOFF_MULTIPLIER is a number, not a duration:
        '^[0-9]+(\.[0-9]+)?$', and at least 1.
      invalid_values: >-
        A value that does not match its grammar, or is out of its range, MUST
        NOT be used. For FEATUREHUB_CONNECT_INTERVAL it is a validation error
        (providers.validation_errors). For the other variables it is a
        validation error, or the SDK logs a warning and uses its default.
      connect_interval:
        allowed: >-
          FEATUREHUB_CONNECT_INTERVAL takes the grammar above, and is 0,
          meaning connect once and stop (polling_transport.interval.zero_polls_once),
          or at least 5 seconds (polling_transport.interval.minimum). Anything
          between 0 and 5 seconds (such as 3s or 500ms) is a validation error.
        valid: ["0", "0s", "5s", "30s", "5000ms", "1.5m", "1h"]
        invalid: ["30", "3s", "500ms", "1m30s", "-30s", "30 s", "ten"]
    names:
      connection:
        FEATUREHUB_EDGE_URL: "the FeatureHub Edge URL (host), when not given in code"
        FEATUREHUB_CLIENT_API_KEY: "a client-evaluated API key (containing '*'), when no key is given in code"
        FEATUREHUB_SERVER_API_KEY: "a server-evaluated API key, used when no key is given in code and FEATUREHUB_CLIENT_API_KEY is not set"
      mode:
        FEATUREHUB_CONNECT_TYPE: "active, passive or streaming: the mode (activePolling, passivePolling or streaming), when not given in code (mode_selection). Compared case-insensitively after trimming; any other value is a validation error (providers.validation_errors)"
        FEATUREHUB_CONNECT_INTERVAL: "a number followed by a time unit, 0 or at least 5 seconds (durations.connect_interval): the polling interval (pollInterval) for both active and passive, when not given in code (mode_selection). Not used by streaming"
      polling:
        FEATUREHUB_POLLING_REQ_TIMEOUT: "duration: how long a polling request may take before it is abandoned (requestTimeout)"
      streaming:
        FEATUREHUB_SSE_CONNECT_TIMEOUT: "duration: how long opening the stream may take before the attempt fails (connectTimeout)"
        FEATUREHUB_SSE_READ_TIMEOUT: "duration: how long an open stream may go without data before it is treated as dropped and reconnected. It SHOULD be more than 5 minutes, as Edge may send nothing for that long, and an SDK SHOULD warn when it is 5 minutes or less (featurehub_edge.streaming.last_event_id.quiet_connections)"
        FEATUREHUB_SSE_INITIAL_RETRY_DELAY: "duration: the wait before the first reconnection attempt after a failure (the backoff's base delay: featurehub_edge.streaming.connection_errors.backoff)"
        FEATUREHUB_SSE_MAX_RETRY_DELAY: "duration: the longest wait between reconnection attempts (the backoff's maximum)"
        FEATUREHUB_SSE_BACKOFF_MULTIPLIER: "number, at least 1: how much the wait grows after each consecutive failure"
      local_overrides:
        FEATUREHUB_LOCAL_YAML: "as feature-store.yaml defines it"
    other_names: >-
      An SDK MAY read further variables for settings of its own. They MUST
      start with FEATUREHUB_, use FEATUREHUB_POLLING_ or FEATUREHUB_SSE_ for
      polling and streaming settings, and take durations as above.
    legacy_names:
      new_sdks: >-
        This specification is implemented only by new SDKs (Dart's
        featurehub-openfeatures packages and Go), which have no earlier
        release to stay compatible with. A new SDK MUST NOT read any legacy
        name: only the names in `names` (and its own, under other_names).
      existing_sdks: >-
        When an existing SDK adopts this specification it keeps its legacy
        variables exactly as it reads them today: this specification does
        not change, unify or remove them, because each SDK reads them
        slightly differently (units, defaults, which one wins). It reads them
        only when none of the names in `names` that replace them is set: if
        FEATUREHUB_CONNECT_TYPE or FEATUREHUB_CONNECT_INTERVAL is set, the
        legacy mode and interval variables are not consulted at all, and
        mode_selection applies. It SHOULD log a deprecation warning when it
        uses a legacy variable, and SHOULD name an ignored legacy variable in
        the validation error when a new one is set without it (for example
        FEATUREHUB_CONNECT_TYPE=passive with only the legacy interval).
      examples: >-
        FEATUREHUB_POLLING_INTERVAL and FEATUREHUB_POLLING_PASSIVE (Java,
        JavaScript, Python and Ruby; JavaScript reads
        FEATUREHUB_POLLING_INTERVAL as milliseconds without a unit, Ruby as
        seconds), FEATUREHUB_POLL_INTERVAL (Python's earlier name, seconds
        without a unit), FEATUREHUB_POLL_HTTP_TIMEOUT (Ruby), and
        FEATUREHUB_API_KEY, FEATUREHUB_POLL_TIMEOUT, FEATUREHUB_DELAY_RETRY_MS
        and FEATUREHUB_BACKOFF_RESET_THRESHOLD (.NET).
    mode_selection:
      description: >-
        When the application does not choose the mode in code (and gives no
        transportFactory), the SDK takes the default mode and interval from
        FEATUREHUB_CONNECT_TYPE and FEATUREHUB_CONNECT_INTERVAL, in this
        order. The first rule that applies wins.
      interval: >-
        FEATUREHUB_CONNECT_INTERVAL applies to both active and passive. When
        either is chosen, the interval MUST be given, either in code (the
        pollInterval passed to the provider or connection) or by
        FEATUREHUB_CONNECT_INTERVAL; the one in code wins. With neither it is
        a validation error (providers.validation_errors): a server-side SDK
        has no default interval, not even 0 (client-side SDKs, which read no
        environment variables, may: default_mode.client_side).
      rules:
        - "FEATUREHUB_CONNECT_TYPE=active: activePolling at the interval (mode_selection.interval). For any key"
        - "FEATUREHUB_CONNECT_TYPE=passive: passivePolling at the interval (mode_selection.interval). For any key"
        - >-
          FEATUREHUB_CONNECT_TYPE=streaming: streaming.
          FEATUREHUB_CONNECT_INTERVAL is not used (an SDK SHOULD log a
          warning if it is set). For a server-evaluated key only in an SDK
          that supports server-evaluated streaming
          (featurehub_edge.streaming.server_evaluated); in one that does not
          it is a validation error (providers.validation_errors)
        - "FEATUREHUB_CONNECT_TYPE not set, FEATUREHUB_CONNECT_INTERVAL set: activePolling at that interval. For any key"
        - >-
          neither set: the default mode (providers.default_mode.server_side):
          streaming. For a client-evaluated key always; for a
          server-evaluated key only in an SDK that supports server-evaluated
          streaming - in one that does not, a server-evaluated key with
          neither variable set is a validation error
          (providers.validation_errors), so the application must choose
          polling.
      featuresUrl: "your own server (feature-snapshot-protocol.yaml) never streams by default: FEATUREHUB_CONNECT_TYPE chooses between active (the default) and passive, with the interval as in mode_selection.interval, and FEATUREHUB_CONNECT_TYPE=streaming is a validation error (providers.validation_errors). As there is no default interval, a featuresUrl with neither variable set and no interval in code is a validation error too"
  local_evaluation_rule:
    description: Whether resolutions evaluate strategies locally (clientEvaluated) or the source is sent the context (sendsContext = !clientEvaluated).
    rules:
      - "apiKey given: clientEvaluated = the key contains '*'"
      - "else featuresUrl or transportFactory given: clientEvaluated = !sendContext"
      - "else (stores only): clientEvaluated = true"
  context_change:
    when_sends_context: >-
      Map the new context; if its x-featurehub form equals the current one do
      nothing; otherwise report RECONCILING (app provider), replace the
      repository's context, set readiness Ready -> Stale (never NotReady:
      the old features are still held and resolved), call
      transport.contextChanged, wait (up to waitForReady) for readiness to
      become Ready again, then report CONTEXT_CHANGED. Once the connection
      has failed or the environment is stale (repository.connection_failed,
      repository.environment_stale), nothing can be fetched: a context change reports CONTEXT_CHANGED
      at once (no RECONCILING, no fetch), and the last features serve only
      the context they belong to (single_context.stopped_for_good). The
      server provider does this per resolution, serialised, so it serves one
      context at a time (single_context).
    single_context:
      rule: >-
        In every SDK, a provider that sends the context (a server-evaluated
        key, or sendContext) has exactly one active context: the
        repository holds the features of one context at a time, and the SDK
        MUST enforce it. Server-evaluated keys on a server are intended for
        single-user batch processes and the like; a server that acts for
        many users uses a client-evaluated key (default_mode.server_side).
        A client-side SDK holds one context per provider instance (where its
        OpenFeature SDK allows a provider only one binding, as Dart's does,
        that is the same rule).
      blocking: >-
        A context change blocks every resolution until the new context's
        features arrive: from the moment it starts, no resolution is
        answered from the previous context's features as the new context's
        result, and none is evaluated for any other context meanwhile.
      asynchronous_resolution: >-
        Where resolutions are asynchronous (the server providers, whose
        OpenFeature SDKs take a context with each resolution): resolutions
        are serialised. A resolution whose context differs from the active
        one starts the change, and it and every resolution queued after it,
        whatever its context, waits for the new context's features, up to
        waitForReady. If they have not arrived by then, that resolution
        returns the code default with ERROR and PROVIDER_NOT_READY; the next
        resolution for the same context waits for them again (up to
        waitForReady), without asking the source again; one for yet another
        context starts a new change.
      synchronous_resolution: >-
        Where resolutions are synchronous and cannot wait (Dart's client
        provider; OpenFeature's static-context SDKs, where the application
        awaits the context change while the provider reports RECONCILING):
        until the new context's features arrive, a resolution returns the
        previous context's value with the reason STALE (its variant and flag
        metadata as usual; errors stay errors), for up to waitForReady after
        the change started; after that, the code default with ERROR and
        PROVIDER_NOT_READY, until the features arrive. The application
        SHOULD await the context change before resolving for the new
        context.
      bounded_wait: >-
        The wait is bounded by waitForReady however the transport behaves:
        a transport whose contextChanged only returns once it has the
        features (a poll) does not lengthen it.
      stopped_for_good: >-
        Once the source has stopped for good (connection_failed,
        environment_stale), nothing can be fetched: a change in progress
        ends, and a new one only records the context. The last features
        belong to one context, the one they were fetched for (features a
        store gave before the first fetch count as the first context's):
        resolutions for that context use them with their usual reasons;
        resolutions for any other context (in a synchronous SDK, while the
        active context is another) return the code default with ERROR and
        PROVIDER_NOT_READY, as its features can no longer be fetched.
        Changing back to the held context resolves them again.
    when_local: nothing to fetch; each resolution evaluates against its own context
  events:
    - {on: "first readiness within waitForReady", event: READY}
    - {on: "not ready within waitForReady", event: "ERROR (GENERAL): '<source> did not become ready within <waitForReady>'"}
    - {on: "Failed before any features (during initialisation)", event: "ERROR (PROVIDER_FATAL); initialisation fails"}
    - {on: "bye (a lost connection being re-established)", event: "none: the provider stays ready"}
    - on: "a permanent stop after features: connection_failed (a rejection, a browser connection error) or environment_stale (polling 236, streaming edge.stale). Not readiness Stale by itself: a context change in progress is Stale too, and reports RECONCILING"
      event: >-
        STALE, after READY (even if the stop came with the first response),
        once; never followed by READY or ERROR. Resolutions continue from the
        last features, with their usual reasons (for a provider that sends
        the context, only for the context they belong to:
        context_change.single_context.stopped_for_good).
    - {on: "applied changes that alter a feature's version, or remove/add one", event: "CONFIGURATION_CHANGED with the changed keys"}
  resolution: >-
    How a resolved feature becomes an OpenFeature result (reasons, variants,
    type conversion, error codes, flag metadata) is specified in
    openfeature-resolution.yaml.
  headers_and_clients:
    headers: sent by every built-in transport (except browser SSE, whose EventSource cannot send headers; a warning is logged) and given to custom transports
    proxy: >-
      Supply HTTP clients configured with a proxy. Proxy credentials belong on
      the HTTP client (e.g. proxy credentials API), not in `headers`, which go
      to the origin server.

# ---------------------------------------------------------------------------
# 6. The built-in FeatureHub Edge transports
# ---------------------------------------------------------------------------
featurehub_edge:
  description: >-
    How the built-in transports talk to FeatureHub Edge itself (not your own
    server). Reference: lib/src/transport/featurehub_polling_transport.dart
    (FeatureHubRestClient, FeatureHubPollingTransport) and
    lib/src/transport/featurehub_sse_transport.dart (FeatureHubSseTransport,
    over sse_client_dartio.dart and sse_client_web.dart).
  extra_headers:
    rule: >-
      Both FeatureHub transports, polling and streaming, MUST let the
      application configure extra headers (for example for an API gateway,
      a proxy in front of Edge, extra authentication or tracing) and MUST
      send them with every request: each poll, and each streaming connection
      and reconnection.
    precedence: >-
      The SDK's own protocol header wins over an extra header of the same
      name: x-featurehub (the context, for a server-evaluated key), on both.
      Other extra headers are sent as given.
    browsers: >-
      A browser's EventSource cannot send headers, so in a browser extra
      headers are only sent when polling; a client SHOULD warn if they are
      configured for streaming (the Dart client logs a warning).
    dart: >-
      The providers' and FeatureHubConnection's `headers` option, passed to
      FeatureHubRestClient (polling) and the SSE listener (streaming); custom
      transports get them as FeatureHubTransportTarget.headers.
  sdk_version:
    rule: >-
      Both FeatureHub transports, polling (activePolling and passivePolling)
      and streaming, MUST send the sdk_version query parameter with every
      request to Edge: each poll, and each streaming connection and
      reconnection (browsers included, as it is a query parameter, not a
      header).
    value: >-
      The protocol generation this specification defines (spec.sdk_version),
      as a decimal integer with no leading zeros: an SDK that complies with
      this specification sends sdk_version=2. It is deliberately not
      spec.version, nor its major part: minor and patch releases of this
      specification change behaviour (scheduling, readiness, environment
      variables, validation) without changing what goes over the wire, and
      would split the cache for nothing. sdk_version changes only when the
      wire protocol to Edge changes (the requests an SDK sends, or the
      responses it relies on), whatever spec.version does. It does not name the SDK, its language or its own release
      version, and it is fixed by the SDK: the application MUST NOT be able
      to change it. An SDK MUST NOT send an sdk_version whose wire protocol
      it does not fully implement.
    why_not_per_sdk: >-
      It deliberately says nothing about which SDK is calling. A CDN (or any
      cache) in front of Edge keys on the whole URL, query string included,
      so a parameter naming each SDK and its release would split the cache
      into one copy per SDK, language and release, all holding the same
      features. Every SDK that speaks the same wire protocol sends the same
      requests, whichever release of this specification it follows, so they send the same
      sdk_version and share one cache entry; the cache splits only when the
      protocol itself changes incompatibly (a new sdk_version), which is
      when a separate entry is wanted. For the same reason an SDK MUST NOT
      add query parameters of its own that identify it.
    encoding: "sent exactly once, in its place in the query string (query_parameters); a decimal integer, so it needs no encoding"
    precedence: >-
      It is the SDK's own parameter: no application configuration (extra
      headers, a host or URL that already carries a query string) replaces
      it.
    generations:
      "1": >-
        A request without sdk_version: the SDKs before this specification.
        Edge ignores their Last-Event-ID and sends the full features on every
        streaming connection.
      "2": >-
        This specification. Edge honours Last-Event-ID and may hold a quiet
        connection (streaming.last_event_id). An SDK MUST NOT send 2 unless
        it implements streaming.last_event_id in full: keeping and sending
        the id, quiet connections, bye_ends_cleanly, short_connections and
        context_change.
    edge_behaviour: >-
      Edge does not require it and MUST NOT reject a request without it
      (older SDKs do not send it); it does not affect which features are
      returned. Edge depends on it to choose the behaviour of a generation:
      it gives the quiet-connection behaviour (streaming.last_event_id) only
      to sdk_version 2 or more, and treats a missing, empty or unparseable
      sdk_version as 1.
    custom_transports: >-
      Not required of a custom transport (transport), which may not talk to
      Edge at all; one that does SHOULD send it, with the sdk_version whose
      specification it complies with.
  query_parameters:
    order: >-
      A CDN keys on the URL exactly as sent, so the same request with its
      parameters in another order is a different cache entry. The SDK's
      query parameters MUST be sent in this order, each at most once:
      apiKey (polling only, each key in the order given; streaming has the
      key in the path), then contextSha, then sdk_version, then xfeaturehub
      (browser streaming of a server-evaluated key only).
    polling: "<host>/features?apiKey=<key>[&apiKey=<key>...]&contextSha=<sha>&sdk_version=2"
    streaming: "<host>/features/<key>?contextSha=<sha>&sdk_version=2[&xfeaturehub=<context>]"
    context_sha: >-
      contextSha is the same value in both: the sha256 of the x-featurehub
      header (encoding.evaluation_context.x_featurehub_header), or 0 when there is none (a
      client-evaluated key, or no attributes). For streaming it keeps a CDN
      from serving one context's stream for another, as the x-featurehub
      header is not part of a cache key.
    host_query: >-
      A host that already carries a query string keeps it first, followed
      by the SDK's parameters in the order above; a parameter of the same
      name in the host is dropped, so each is sent once.
  polling:
    edge_api:
      description: >-
        The polling request is the getFeatureStates operation of the
        FeatureHub Edge OpenAPI definition, version 1.1.9
        (http://api.dev.featurehub.io/edge/1.1.9.yaml; in the FeatureHub
        repository, infra/api-bucket/files/edge/1.1.9.yaml). The extract below
        is that operation and the schema of its response, trimmed to what the
        SDKs use; FeatureState and FeatureRolloutStrategy are
        encoding.feature_state and encoding.rollout_strategy. Edge's SSE
        stream is not part of that definition (featurehub_edge.streaming).
      operation:
        method: GET
        path: /features/
        operationId: getFeatureStates
        parameters:
          - name: apiKey
            in: query
            required: true
            schema: {type: array, items: {type: string}}
            style: form
            explode: true
            description: >-
              The API keys to fetch: one apiKey parameter per key
              (?apiKey=k1&apiKey=k2). See several_api_keys.
          - name: contextSha
            in: query
            required: false
            schema: {type: string}
            description: >-
              Not used by Edge. It breaks caches in front of Edge when the
              client's context changes, and MUST be present if Edge runs with
              Fastly support. The SDKs always send it (request).
        responses:
          "200":
            description: all the environments the keys have permission to, or that were found
            headers: {x-fh-version: {required: false, schema: {type: string}}}
            content: {application/json: {schema: {type: array, items: {$ref: "#/FeatureEnvironmentCollection"}}}}
          "236":
            description: the environment is stale ("its not you, its me, environment stagnant"); the body is as for 200
            headers: {x-fh-version: {required: false, schema: {type: string}}}
            content: {application/json: {schema: {type: array, items: {$ref: "#/FeatureEnvironmentCollection"}}}}
          "400":
            description: no environments were asked for (no apiKey)
            headers: {x-fh-version: {required: false, schema: {type: string}}}
      schemas:
        FeatureEnvironmentCollection:
          type: object
          required: [id]
          properties:
            id: {type: string, format: uuid, description: "the environment's id"}
            features: {type: array, items: {$ref: "featurehub/feature-state"}, description: "absent means none"}
          description: >-
            One environment's features. A GET can ask for several API keys
            at once, so the response is an array of these, one per
            environment.
      not_in_the_definition: >-
        The definition documents only the operation itself. The rest of the
        contract the SDKs rely on is specified here: the x-featurehub request
        header (request) and the extra headers (extra_headers); the sdk_version
        query parameter (sdk_version); If-None-Match,
        ETag and 304 (etag); Cache-Control (cache_control); and the statuses
        it does not list - 304, every other 4xx and the 5xx (responses).
      differences:
        - "FeatureState: the definition requires only id and key; this protocol also requires version and type (encoding.feature_state.required_fields)"
        - "FeatureState.environmentId: never sent by Edge (the FeatureEnvironmentCollection carries the id); an SDK MAY fill it in from the collection"
        - "rollout strategies: the definition has values not nullable and attributes and percentageAttributes defaulting to []; decoders still accept null and absence for all of them (encoding.rollout_strategy.decoding_rules), which is more lenient and covers other encoders"
        - "FeatureEnvironmentCollection.features: the definition does not make it nullable; decoders accept null as none (body)"
    request: >-
      GET <host>/features?apiKey=<key>[&apiKey=<key>...]&contextSha=<sha256
      of the x-featurehub header, or 0>&sdk_version=2 (spec.sdk_version), in
      that order (query_parameters); with the x-featurehub header for a
      server-evaluated key, and the extra headers (extra_headers).
      sdk_version is required of every poll, active and passive
      (sdk_version). This is
      edge_api's getFeatureStates.
    several_api_keys: >-
      An SDK MAY accept several API keys, sent as repeated apiKey
      parameters; the response then has one environment per key. The
      features of all the environments in a response together are one full
      set, and MUST be given to the repository as one notify(features).
      Notifying each environment's features in turn is wrong: each full set
      removes the features not in it, so every environment would remove the
      ones before it.
    body: >-
      A 200 or 236 body from FeatureHub is always a JSON array of
      environments (edge_api FeatureEnvironmentCollection), each a JSON object
      with a `features` array (absent or null means none):
      [{"id": "e1", "features": [...]}, ...]. Anything else
      can only come from something between the SDK and Edge (a proxy or
      gateway) or a fault, and is an error, as for a network error: a top
      level that is not an array, an entry that is not an environment object,
      or a `features` that is not an array. It is
      logged, nothing is notified, the repository is unchanged, and the next
      poll retries. A null entry in the array is skipped.
    responses:
      - {status: 200, action: "load the features (an array of environments, each with its features): a full set, the features of every environment together (several_api_keys)"}
      - {status: 304, action: "only in reply to If-None-Match (etag): nothing has changed; not an error, nothing is notified, and the ETag is kept and sent again with the next request"}
      - status: 236
        action: >-
          load the features as for 200, then stop polling for good and
          markEnvironmentStale(). Not a failure and not a lost connection:
          readiness goes from Ready to Stale and the provider reports STALE, permanently.
      - {status: "4xx", action: "the key is rejected: notify(failure), stop polling. Every 4xx, 429 included (unlike the snapshot client, which retries 429)"}
      - {status: "other, or a network error / timeout", action: "an error; the next poll retries"}
    etag:
      rule: >-
        An SDK MAY send If-None-Match with the ETag it holds. It gets an ETag
        from a 200 or 236 response whose body it applied (not one whose body
        failed, or the server would answer 304 for good). A 304 means nothing
        has changed, so the ETag it was answering is still current: it MUST be
        kept and sent again with every later request, for as long as the
        server keeps answering 304 (it is not cleared by a 304, nor by an
        error such as a 5xx or a network failure). The ETag belongs to the context it
        was fetched for: a context change MUST clear it, and an ETag from a
        response to a request made for a context that has since changed MUST
        NOT be kept. Otherwise a 304 for the old context's ETag would leave
        the repository with the old context's features (and, after a
        context change, waiting for a readiness that never comes).
    cache_control:
      rule: >-
        If a 200 or 236 response has a Cache-Control header containing
        max-age=<n> (the first `max-age=(\d+)` match) and n > 0, the polling
        interval becomes n seconds, replacing the configured one, whether
        shorter or longer. It applies to every later poll (and to passive
        mode's freshness) until another max-age changes it; a response
        without one leaves it as it is. A missing, zero or unparseable
        max-age changes nothing. A max-age below the minimum interval
        (polling_transport.interval.minimum, 5 seconds) is raised to it. With
        a configured interval of 0 (poll once) a max-age does not start
        polling again.
      other_responses: >-
        max-age MUST NOT be read from any other response (304, 4xx, 5xx): a
        failing proxy or gateway answering 503 with max-age=1 would otherwise
        make every client poll once a second while Edge is down. Parse it
        only once the status is known to be 200 or 236.
      typescript_reference: >-
        parseCacheControl: cacheHeader.match(/max-age=(\d+)/); if the parsed
        value > 0, frequency = value * 1000 ms.
      dart_difference: the Dart SDK matches max-age case-insensitively; TypeScript is case-sensitive
      snapshot_client: "not applied: the snapshot client (your own server; feature-snapshot-protocol.yaml) polls at its configured interval and uses ETags instead"
  streaming:
    request: >-
      An SSE stream from <host>/features/<key>?contextSha=<sha256 of the
      x-featurehub header, or 0>&sdk_version=2 (spec.sdk_version; both
      required on every connection and reconnection, in that order:
      query_parameters); for a server-evaluated key
      (in an SDK that supports it: server_evaluated), sending the
      x-featurehub header (dart:io) or the xfeaturehub query parameter,
      after sdk_version (browsers, whose EventSource cannot send headers);
      and, except in
      browsers, the extra headers (extra_headers) on every connection and
      reconnection; and, on a reconnection, Last-Event-ID (last_event_id).
    last_event_id:
      rule: >-
        Edge's events carry an SSE id: field. An SSE client MUST keep the id
        of the last event it received (as the SSE standard's last event ID:
        an event with no id: field, such as Edge's bye, leaves it as it was)
        and MUST send it as the Last-Event-ID header on every reconnection.
        A browser's EventSource does this itself on the reconnections it
        makes; a new EventSource starts without one, and gets the full
        features.
      no_new_updates: >-
        With a Last-Event-ID that is current, Edge does not send the features
        again. It holds the connection open for a period (typically 60
        seconds, but it can be 3 to 5 minutes) during which it may send
        nothing at all, then sends bye (with no id: field) and closes the
        connection; or the connection ends with an error, because of a
        network issue. An SDK MUST expect this: a connection, and several
        reconnections in a row, may deliver no updates at all before the
        next change arrives. It is normal, not a failure, not a lost
        connection and not stale: the repository keeps its features, and
        its readiness does not change (Ready stays Ready).
      quiet_connections: >-
        Because Edge may send nothing for up to 5 minutes before its bye, an
        SDK MUST NOT treat a stream that is silent for less than that as
        dropped. A read timeout (FEATUREHUB_SSE_READ_TIMEOUT, or the SDK's
        own setting), where an SDK has one, SHOULD default to more than 5
        minutes, and an SDK SHOULD warn when one is configured at 5 minutes
        or less:
        otherwise every quiet connection ends as a timeout, counted as a
        failure (connection_errors), and the client backs off, or stops for
        good, while Edge is healthy.
      bye_ends_cleanly: >-
        Edge always sends bye when it closes a connection itself, and only
        when it evicts the connection at the end of its wait (60 seconds or
        more). A connection that ends after a bye, and that was open for at
        least the short-connection threshold (short_connections), ended
        cleanly: it is not a failure, it resets the count of consecutive
        failures (connection_errors.attempt_reset), and the client
        reconnects (with its Last-Event-ID) after the first-attempt delay. A
        connection that ends without a bye ended with an error, and is
        counted as a failure (connection_errors.classification).
      short_connections:
        threshold: 10 seconds
        measured_from: >-
          The request: the threshold runs from when the connection's request
          is sent, not from when its response opens, so a server or proxy
          that is slow to send the response headers does not make a long
          connection look short. A cache replaying a closed stream answers
          at once, so it is caught either way. In browsers, from creating the
          EventSource, or from the error that begins one of its own
          reconnections.
        rule: >-
          Edge never ends a connection of its own accord sooner than the end
          of its wait, so a connection that ends less than 10 seconds after
          its request was sent (measured_from) did not come from Edge working
          normally, whether it ended with a bye or not. It MUST be counted as a failure (the
          network-error delay, growing with the backoff, and counting towards
          the maximum attempts: connection_errors), and nothing it delivered
          resets the count of consecutive failures (attempt_reset) - not its
          bye, nor its ack, features or other events. Its events are still
          handled as usual (features applied, edge.stale obeyed).
        why: >-
          A cache or CDN in front of Edge that does not handle SSE correctly
          can answer at once with a stored, already-closed stream ending in
          bye. That usually happens to a cache entry that Edge has stopped
          updating, after it sent edge.stale on it. Were that bye a clean
          end, every client behind the cache would reconnect at the
          first-attempt delay, for ever. Counted as failures, they back off to
          the maximum wait, and stop where a maximum number of attempts is
          configured (a permanent failure: stopping_for_good).
        reset_timing: >-
          The reset an event earns (attempt_reset) therefore takes effect
          once the threshold has passed since the request: an event in
          the first 10 seconds marks the reset as due, and it is made when the
          connection reaches 10 seconds (or at once, for an event after
          that). A connection that ends before then counts as a failure and
          the due reset is dropped.
        diagnosis: >-
          After 3 consecutive short connections an SDK SHOULD log a warning,
          once until a connection lasts past the threshold, saying that
          something in front of Edge is ending its event streams early and
          that SSE responses must not be cached (Edge's event streams are not
          cacheable; a CDN must pass them through, or bypass them).
        tests: >-
          An SDK MAY lower the threshold for its own tests (as with
          polling_transport.interval.minimum), but MUST NOT let applications
          change it.
        browsers: >-
          A browser's EventSource reconnects by itself, without telling the
          client how long the connection lasted, and does not back off. A
          browser SDK SHOULD apply the rule where it can see the connection
          (measured_from), to the error or bye that ends it: after a short
          connection it closes the EventSource and reconnects itself, backing
          off as for any failure. If short connections reach the maximum
          attempts it treats it as a permanent failure
          (connection_errors.browsers); without a maximum, it keeps backing
          off, up to the maximum delay, as any other SDK does.
      context_change: >-
        The Last-Event-ID belongs to the API key and context it was received
        for, as the ETag does when polling (featurehub_edge.polling.etag): a
        connection opened for a new context, a server-evaluated key's in
        particular, MUST NOT send the previous context's Last-Event-ID.
        Otherwise Edge would answer that nothing is new, and the repository
        would keep the old context's features (and, after a context change,
        wait for a readiness that never comes).
    server_evaluated:
      support: >-
        OPTIONAL. An SDK MAY support server-evaluated keys (no '*') over
        streaming; if it does, streaming is a valid mode for them and it MUST
        send the context (request) on every connection and reconnection.
        Polling (activePolling, passivePolling) MUST support them in every
        SDK. Client-evaluated keys ('*') over streaming are not optional.
      when_unsupported: >-
        An SDK that does not support it MUST NOT open a stream for a
        server-evaluated key, since FeatureHub would evaluate without the
        context and the application would get wrong values with no error: a
        streaming mode with one is then rejected at configuration
        (providers.validation_errors), unless a transportFactory is given.
      default_mode: >-
        In an SDK that supports server-evaluated streaming, a
        server-evaluated key defaults to streaming on a server, as a
        client-evaluated one does; in one that does not, it has no default
        mode and the mode MUST be chosen (explicitly, or through the SDK's
        environment variables), or it is a validation error
        (providers.default_mode, providers.validation_errors). A
        server-evaluated key gives the provider a single context
        (providers.context_change.single_context).
      sdk_status: >-
        The Go, Python, .NET and Ruby SDKs do not support server-evaluated
        keys over streaming (they do not send x-featurehub on the SSE
        connection), so they are bound by when_unsupported.
    events:
      - "features / feature / delete_feature: as transport.relaying_featurehub_events"
      - "failure: notify(failure), close; no reconnect"
      - "bye: notify(bye) (the provider stays ready; it is not reported as stale); the connection ends cleanly, and the client reconnects with its Last-Event-ID (last_event_id.bye_ends_cleanly), unless it was a short connection, which is a failure (last_event_id.short_connections)"
      - "the stream dropping without a bye: notify(bye), and reconnect under the reconnect policy, counted as a failure (connection_errors)"
      - >-
        config with an edge.stale key: its presence alone means stale,
        whatever the value ({"edge.stale": true}, {"edge.stale": false},
        {"edge.stale": null} all do). It arrives after the features have been
        delivered; markEnvironmentStale(), close the stream, and do not
        reconnect or send bye. Readiness goes from Ready to Stale; the provider reports
        STALE, permanently. A config event without an edge.stale key, or
        whose data is not a JSON object, is ignored: it is not a stale
        signal and does not close the stream.
    connection_errors:
      description: >-
        When the stream cannot be opened, or a reconnection attempt fails, an
        SSE client that is not a browser's EventSource (which hides the HTTP
        status) MUST determine whether the failure was a 4xx or a 5xx
        response, as they mean opposite things.
      not_an_event_stream: >-
        A 200 response whose Content-Type is not text/event-stream (for
        example an HTML page from a gateway, proxy or captive portal) MUST be
        treated as a failed connection, temporary like a network error
        (notify(bye), and backed off as any failed attempt is: requirement),
        not as a stream that opened. Otherwise it looks like a stream that
        opens and ends at once, forever, with no backoff. It SHOULD use the
        network-error delay and count towards the maximum attempts, where the
        reference behaviour has them (backoff).
      not_an_event_stream_in_browsers: >-
        A browser's EventSource cannot meet not_an_event_stream: it refuses a
        response that is not text/event-stream itself, closing for good
        (readyState CLOSED) without saying why, so it cannot be told from a
        4xx. A browser SDK is exempt: it treats that close as it treats any
        other (Dart: a permanent failure).
      classification:
        - status: 4xx
          meaning: "permanent: the API key or environment is rejected. Every 4xx, 429 included (unlike the snapshot client, which retries 429)"
          action: "notify(failure) and stop: no further attempts (transport.permanent_failure)"
        - status: 5xx
          meaning: "temporary: Edge, or something in front of it, is failing"
          action: "notify(bye) (the provider stays ready) and keep trying, with a backoff"
        - status: "1xx or 3xx"
          meaning: "not a valid response to an SSE request: temporary, as for a 5xx"
          action: "notify(bye) and keep trying, with the same backoff as a 5xx"
        - status: "no status: a network error, a timeout, or the stream ending"
          meaning: temporary
          action: "notify(bye) and keep trying, with a backoff"
      stopping_for_good: >-
        If the client stops retrying for any other reason (an application's
        reconnect policy that does not retry some status, or running out of
        its maximum number of attempts), nothing will reconnect: that is a
        permanent failure, so it MUST notify(failure), not bye
        (transport.permanent_failure).
      requirement: >-
        An SSE client MUST back off: consecutive failed attempts wait longer,
        up to a maximum wait, and both the backoff (its delays and how they
        grow) and that maximum MUST be configurable by the application. That
        is all that is required of the delays. The rest of this section
        (backoff, attempt_reset, minimums, reference_defaults) describes the
        reference behaviour, which implementations SHOULD follow but need not
        match exactly; an SSE library's own backoff is acceptable if it meets
        the requirement. The classification of failures and stopping_for_good
        are not delays and remain MUST.
      backoff: >-
        Retries SHOULD wait longer after a 5xx than after a network error, and
        SHOULD grow with each consecutive failure up to a cap, so a failing Edge
        is not hammered. A configurable maximum number of attempts MAY stop
        retrying; running out of attempts is then a permanent failure
        (stopping_for_good).
      attempt_reset: >-
        The count of consecutive failures SHOULD reset only when the connection
        delivers a FeatureHub event showing it works: ack, features, feature,
        delete_feature, config or bye. A bye is included because Edge always
        sends one when it closes a connection itself, including one that
        delivered nothing else (last_event_id.no_new_updates): without it,
        healthy quiet connections would use up the maximum attempts. Not
        merely when the connection opens (a 200), and not on an error or
        failure: a server or proxy that accepts the connection and drops it
        without any of these events must still back off and use up the
        maximum attempts, rather than reconnect at the first-attempt delay
        forever. Nor in a short connection (last_event_id.short_connections):
        the reset an event earns is made only once the connection has been
        open for the threshold. The reset SHOULD happen before the end of that same
        stream is counted as the next failure: an implementation whose SSE
        library reports the stream ending separately from (and possibly
        before) handing over the events before it SHOULD reset where the stream
        is read (Go watches the response body's event: lines), not where the
        events are handled.
      minimums: >-
        No configuration should make a tight reconnect loop. Every wait before a
        reconnection attempt SHOULD be at least 100ms, after jitter and whatever
        the reconnect policy or the server says (policy delays and caps below
        it are raised to it). A server's SSE retry: field (milliseconds) that
        replaces the network-error delay SHOULD be raised to at least 1 second
        (retry: 10 would otherwise reconnect every 10ms); the backoff
        multiplier still applies to it.
      reference_defaults: >-
        Dart (defaultReconnectPolicy, a featurehub_sse_client ReconnectPolicy):
        3s after a network error or a dropped stream (a server retry: field
        may replace it), 30s after a retried status (a 5xx, 1xx or 3xx);
        delay = base * backoffMultiplier^(attempt - 1), capped at maxDelay,
        with backoffMultiplier 2 and maxDelay 5 minutes; unlimited attempts;
        shouldRetryStatus every status but a 4xx
        (featureHubShouldRetryStatus). The listener notifies failure whenever
        the event source stops for good. The minimums are
        featurehub_sse_client's minReconnectDelay (100ms) and
        minServerRetryDelay (1s), in its unexported lib/src/limits.dart, and
        the attempt count resets on the events featureHubEventShowsConnectionWorks
        accepts (the EventSource's resetAttemptsOn, checked as the stream is
        read). The browser listener resets in its event handlers, and has the
        same 100ms floor for the reconnections it schedules. Go (core.DefaultReconnectPolicy):
        the same, plus up to 50% jitter, with core.MinReconnectDelay (100ms)
        and core.MinServerRetryDelay (1s) as the minimums.
      configuration: >-
        The backoff and the maximum wait MUST be configurable by the
        application (requirement). Where an implementation has them, the
        network-error delay, the 5xx delay, the multiplier, the maximum number
        of attempts, and which statuses are retried SHOULD be configurable too
        (Dart: the providers' reconnectPolicy option).
      browsers: >-
        A browser's EventSource does not expose the status of a failed
        connection, so a browser client cannot tell a 4xx from a 5xx. A
        connection error (the EventSource closing: readyState CLOSED) is
        therefore final: the client notifies failure and stops, with no
        further attempts. Before any features the provider's initialisation
        fails (PROVIDER_FATAL); after them the provider goes STALE for good,
        keeping the last features. A dropped connection the browser reconnects by
        itself (readyState CONNECTING) is only a bye. A connection that the
        client's own request timeout abandons MAY be retried under the
        reconnect policy; running out of attempts is then also final.

# ---------------------------------------------------------------------------
# 7. Conformance checks (each is a test in the reference implementation)
# ---------------------------------------------------------------------------
  feature_updates:
    description: >-
      Changing a feature's value or lock in an environment through Edge (the
      "test API"), with the environment's API key: for tests, test tools and
      end-to-end suites (todo-server-tests.yaml), not for resolving flags.
      The change is made by FeatureHub: Edge accepts it and publishes it,
      and it reaches every client, the updater's own included, later,
      through their usual polling or streaming. An SDK's updater is
      separate from its providers and repository: it changes nothing
      locally.
    support: >-
      Every SDK, client- and server-side, MUST provide one (Dart:
      FeatureHubFeatureUpdater in featurehub-openfeatures-common, exported by
      both providers). It works with a client- or a server-evaluated key.
    permissions: >-
      The API key's service account needs, in that environment, the
      CHANGE_VALUE permission to change a value, LOCK to lock and UNLOCK to
      unlock (READ alone is not enough: 403). Edge checks them on every
      request.
    request:
      method: PUT
      url: >-
        <host>/features/<apiKey>/<featureKey>: the host as configured (a
        query string it carries is kept, after the path), the API key as it
        is (its / separators are path separators, as in streaming), and the
        feature key encoded as a path segment.
      headers: "content-type: application/json, and the extra headers (extra_headers); no x-featurehub and no sdk_version: an update is not cached and does not identify a generation"
      body:
        schema: "FeatureStateUpdate: {value?: any, updateValue?: boolean, lock?: boolean}; absent and null are the same"
        value: >-
          The new value, when one is set: for a BOOLEAN feature true or
          false (Edge also takes the strings "true" and "false", in any
          case); for a NUMBER a JSON number (or a string holding a decimal
          number); for a STRING a string; for a JSON feature a string
          holding the JSON text, never a JSON object or array (Edge reads the
          value as text: an object is not valid JSON there). An SDK whose
          caller gives a JSON feature's value as a map or list MUST encode
          it to its JSON text first.
        updateValue: >-
          true to change the value. A non-null value implies it (Edge sets it
          itself), so it is only needed to clear the value: updateValue true
          with no value makes the feature "not set" (not possible for a
          BOOLEAN: 412).
        lock: "true to lock, false to unlock, absent to leave the lock as it is. Unlocking and changing the value in one request is how a locked feature's value is changed"
      nothing_to_do: "a body with no value, no updateValue and no lock is a 400; an SDK MAY refuse to send it"
    responses:
      "200": "applied: the change was accepted and published; it reaches the clients later (Edge's API definition says 201 for this; Edge answers 200, and an SDK MUST treat 200 and 201 alike)"
      "201": applied (as 200)
      "202": "unchanged: neither the value nor the lock would change"
      "400": "invalid: nothing to do, or a value that is not valid for the feature's type (a flag set to anything but true or false, a number that is not a number, JSON that does not parse)"
      "403": "forbidden: the key's service account lacks the permission the change needs (no write role, LOCK, UNLOCK or CHANGE_VALUE)"
      "404": "not found: the API key, the environment or the feature does not exist"
      "412": "not possible: changing a locked feature's value without unlocking it in the same request, or clearing a flag's value"
      "503": "unavailable: updates are blocked for now (FeatureHub is in maintenance); its Retry-After says when to try again"
      other: "failed: a 5xx, any other status, a network error or a timeout"
    result: >-
      The updater returns the outcome, never throwing for an HTTP status or a
      network error: applied, unchanged, invalid, forbidden, notFound,
      notPossible, unavailable (with the Retry-After delay, when one is
      given) or failed; the status code (none for a network error or
      timeout); and success = applied or unchanged (a 2xx). It MUST NOT retry
      by itself: an update is a write, and whether to retry (after a 503's
      Retry-After, or a conflicting update) is the caller's choice.
    timeout: "a request timeout, as polling's requestTimeout; an SDK MAY default to a few seconds (the JavaScript SDK: 3)"
    concurrent_updates: >-
      FeatureHub applies updates with optimistic locking: an update that
      races another to the same feature can be accepted (200) and then lost.
      A caller that needs a change to have been made confirms it by watching
      for it through a client (todo-server-tests.yaml awaiting_a_change),
      and repeats it if it does not arrive.

conformance:
  - id: sha-vectors
    check: encoding.sha.test_vectors all reproduce
  - id: polling-every-interval
    check: "with a 1s interval and an immediate server, 4 requests are made in 3.5s (initial + 3)"
  - id: polling-from-end-of-poll
    check: "with a 1s interval and a server taking 0.6s, requests start 1.6s apart: 3 in 3s after the first response"
  - id: polling-max-age
    check: "a Cache-Control max-age replaces the poll interval, shorter or longer"
  - id: polling-max-age-only-on-success
    check: "a max-age on a 304, 429, 502 or 503 response leaves the poll interval unchanged; on a 200 or 236 it replaces it"
  - id: polling-zero-interval
    check: "with an interval of 0, activePolling and passivePolling (FeatureHub and snapshot) make exactly one request, however many resolutions follow and whatever max-age says; the transport does not stop or fail"
  - id: polling-negative-interval
    check: "a negative poll interval is a validation error"
  - id: polling-minimum-interval
    check: "a poll interval of 4s (or 1ms) is a validation error, for FeatureHub and snapshot polling; 5s and 0 are valid; a max-age=1 response sets the interval to 5s"
  - id: edge-polling-rejection
    check: "polling FeatureHub: any 4xx notifies failure (connection_failed: readiness Failed before features, Stale after) and stops polling; a 5xx keeps polling"
  - id: edge-polling-several-environments
    check: "a response with two environments (two API keys), each with its own features, leaves the repository holding the features of both, from one notify(features)"
  - id: edge-polling-invalid-body
    check: >-
      a 200 whose body is not the array of environments that FeatureHub
      sends (polling.body) - for example a single environment that is not
      wrapped in an array ({"id": "e1", "features": []}), an array holding
      something other than environments (["e1"]), or an environment whose
      features is not an array ([{"id": "e1", "features": {"key": "f1"}}]) -
      notifies nothing and leaves the repository unchanged; the next poll
      retries
  - id: edge-polling-etag-per-context
    check: "after a 304 the next request sends the same If-None-Match; after a context change the next request sends no If-None-Match; an ETag returned for a request whose context changed while it was in flight is not kept"
  - id: polling-context-change-after-close
    check: "a context change on a closed polling transport makes exactly one request, applies its features, and does not start polling again"
  - id: features-invalid-payload
    check: "notify(features) with a string, an object or a number changes nothing: no feature is removed and readiness is unchanged"
  - id: failure-after-context-change
    check: "features received, a context change (readiness Stale, never NotReady), then a failure: connection_failed is raised, readiness stays Stale (not Failed), and the old features still resolve"
  - id: context-change-readiness
    check: "a context change takes readiness Ready -> Stale and, when the new context's features arrive, Stale -> Ready; the provider reports RECONCILING then CONTEXT_CHANGED, never STALE"
  - id: x-featurehub-encoding
    check: "encoding.evaluation_context.x_featurehub_header.examples all reproduce: keys and values are both encoded, then the encoded strings sorted"
  - id: edge-stale
    check: "a 236 (polling) or edge.stale (streaming) after features: the repository's readiness is Stale, environmentStale is true, nothing more is requested, the provider reports STALE once, and (SHOULD) one warning is logged. Any edge.stale value counts, false and null included"
  - id: bye-not-stale
    check: "a bye leaves the repository's readiness unchanged (Ready stays Ready, Stale stays Stale, nothing is broadcast), and the provider reports no event"
  - id: streaming-statuses
    check: "the default reconnect policy retries 1xx, 3xx and 5xx, and not any 4xx (429 included)"
  - id: streaming-not-an-event-stream
    check: "a 200 with Content-Type text/html is a failed connection: notify(bye), and backed off, not a stream that opened"
  - id: streaming-not-an-event-stream-delay
    check: "(SHOULD) a 200 with Content-Type text/html is retried with the network-error delay and counted towards the maximum attempts"
  - id: streaming-backoff
    check: "consecutive failed SSE connections wait increasingly longer, never longer than the configured maximum wait; changing the configured backoff and maximum changes the waits"
  - id: streaming-attempt-reset
    check: "(SHOULD) with a maximum of 3 attempts, a server that accepts and drops every connection with no events stops the client after 3 attempts; one whose every third connection delivers an ack keeps it running, and so does one whose every connection only sends bye after a silence longer than the short-connection threshold"
  - id: streaming-last-event-id
    check: >-
      after features with id: fields, a reconnection sends the last id as
      Last-Event-ID (a bye with no id: field does not change it); a server
      that then sends nothing for a while and only bye, many times in a row,
      leaves the repository's features and readiness unchanged, is never
      counted as a failure and never stops the client; the default read
      timeout is more than 5 minutes (checked by its value; a test need not
      wait); a connection for a new context sends no Last-Event-ID
  - id: streaming-short-connections
    check: >-
      (with the threshold lowered for the test; measured from the request)
      with a maximum of 3
      attempts, a server whose every connection sends features, or nothing,
      and then bye, and closes before the threshold, stops the client after
      3 attempts (a permanent failure), the waits between them growing as
      for any failure; the features are still applied; a warning is logged
      after 3 short connections in a row; one whose connections last past
      the threshold before their bye never stops it
  - id: streaming-minimum-delays
    check: "(SHOULD) a policy with nanosecond delays and full jitter, and a server retry: 1, still wait at least 100ms before each attempt; a retry: below 1000 is used as 1 second"
  - id: streaming-stops-for-good
    check: "the event source stopping for good (a 4xx, an unretried status, no attempts left) notifies failure, never bye"
  - id: permanent-failure
    check: "a permanent failure before features raises connection_failed, sets readiness Failed and fails initialisation (PROVIDER_FATAL); after them it raises connection_failed, readiness goes from Ready to Stale, the provider reports STALE once and keeps resolving"
  - id: readiness-transitions
    check: "readiness never goes Ready -> NotReady (clearing goes Ready -> Stale -> NotReady), never NotReady -> Stale, and never to Failed once a full set has been received; Failed is final; a full set takes Stale -> Ready, except after connection_failed or environment_stale, when it is applied and readiness stays Stale"
  - id: edge-stale-config-ignored
    check: "a streaming config event without an edge.stale key (e.g. {}), or whose data is not an object, is ignored: the stream stays open and nothing is marked stale"
  - id: nullable-strategy-fields
    check: "strategies whose attributes, percentageAttributes or values are null or absent decode, and evaluate as empty lists"
  - id: environment-mode-selection
    check: >-
      in a server-side SDK, with no mode in code:
      FEATUREHUB_CONNECT_TYPE=active gives activePolling and passive gives
      passivePolling, each at the interval from code or
      FEATUREHUB_CONNECT_INTERVAL, and either with no interval is a
      validation error; streaming streams, ignoring
      FEATUREHUB_CONNECT_INTERVAL (a validation error for a server-evaluated
      key in an SDK without server-evaluated streaming); ACTIVE and
      " passive " are accepted, and any other value is a validation error;
      FEATUREHUB_CONNECT_INTERVAL alone gives activePolling; neither streams
      a client-evaluated key, and for a server-evaluated key streams in an
      SDK that supports it or is a validation error in one that does not; an
      empty variable counts as not set; a mode set in code wins over the
      environment; with a featuresUrl, streaming is a validation error and
      no FEATUREHUB_CONNECT_TYPE means active
  - id: environment-durations
    check: >-
      every duration variable accepts 0, 0s, 30s, 500ms, 1.5m and 1h, and
      accepts " 30s " (trimmed); 30, 1.5, 1m30s, -30s, +30s, "30 s", 30S,
      1us, .5s and ten are not durations; FEATUREHUB_SSE_BACKOFF_MULTIPLIER
      accepts 1 and 1.5, not 0.5, 2x or -1
  - id: environment-connect-interval
    check: >-
      FEATUREHUB_CONNECT_INTERVAL accepts 0, 0s, 5s, 30s, 5000ms, 1.5m and
      1h; 30, 3s, 500ms, 1m30s, -30s, "30 s" and ten are validation errors,
      in every server-side SDK
  - id: environment-legacy-names
    check: >-
      an existing SDK reads its legacy mode and interval variables as before
      only when neither FEATUREHUB_CONNECT_TYPE nor FEATUREHUB_CONNECT_INTERVAL
      is set; with either set, the legacy ones are ignored
  - id: environment-names
    check: "each name in providers.environment_variables.names is read, with that meaning, by every server-side SDK; no client-side SDK reads them"
  - id: connection-default-mode
    check: "a FeatureHubConnection with a featuresUrl and no mode polls actively; with a host and a client-evaluated key it streams; with a server-evaluated key and no mode (none from environment variables either) it streams in an SDK that supports server-evaluated streaming, and is a validation error in one that does not"
  - id: client-default-mode
    check: "a client-side provider with no mode uses its documented default for any key and for a featuresUrl (Dart's client provider: passivePolling, every 30 seconds by default)"
  - id: single-context
    check: >-
      with a server-evaluated key: in an asynchronous SDK, resolutions for
      two contexts made at once each get their own context's values, never
      the other's; a context change whose features arrive after
      waitForReady gives that resolution the code default with
      PROVIDER_NOT_READY (not the previous context's value), and the next
      resolution for that context waits again and gets its value, the
      source being asked once. In a synchronous SDK, during a context
      change a resolution returns the previous context's value with reason
      STALE, after waitForReady the code default with PROVIDER_NOT_READY,
      and once the features arrive the new context's value with its usual
      reason. After a permanent stop, a resolution for a context other than
      the held one returns the code default with PROVIDER_NOT_READY, nothing
      is fetched, and the held context still resolves
  - id: server-evaluated-streaming
    check: "a server-evaluated key with streaming, in an SDK that supports it, sends the context on every connection and reconnection; in one that does not, it is rejected at configuration and no stream is opened; with activePolling or passivePolling it polls, sending x-featurehub"
  - id: sdk-version
    check: "every request to Edge - each activePolling and passivePolling poll, and each streaming connection and reconnection, in browsers too - carries exactly one sdk_version query parameter, 2 (spec.sdk_version) for this specification, and no parameter naming the SDK, its language or its release; extra headers or configuration cannot replace it"
  - id: query-parameter-order
    check: "a poll's query string is apiKey (each, in order), contextSha, sdk_version; a stream's is contextSha, sdk_version, then xfeaturehub (browser, server-evaluated key); streaming sends contextSha (0 for a client-evaluated key); a host with a query string keeps it first, and a parameter of the same name in it is not sent twice"
  - id: passive
    check: "refreshIfStale fetches only after the interval; no requests of its own otherwise"
  - id: custom-transport
    check: "a user transport fills the repository, follows a context change, applies pushed updates, and a closed connection (bye) leaves the repository Ready, resolving from the last features"
  - id: feature-update-request
    check: "the updater sends PUT <host>/features/<apiKey>/<featureKey> with content-type application/json, the extra headers and a FeatureStateUpdate body: a value (a JSON feature's map or list as its JSON text), lock true or false, or updateValue true with no value to clear it; nothing else in the body; no sdk_version"
  - id: feature-update-outcomes
    check: "200 and 201 are applied, 202 unchanged, 400 invalid, 403 forbidden, 404 notFound, 412 notPossible, 503 unavailable with its Retry-After, and a 500, another status or a network error failed; none throws, and nothing is retried"
